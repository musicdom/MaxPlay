<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAX Выгода</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --bg-primary:#f2f2f7;
            --bg-secondary:#ffffff;
            --bg-tertiary:#e8e8ed;
            --text-primary:#1c1c1e;
            --text-secondary:#6e6e73;
            --text-tertiary:#aeaeb2;
            --accent:#0071e3;
            --accent-hover:#0060c0;
            --success:#30d158;
            --danger:#ff3b30;
            --warning:#ff9f0a;
            --vip-gold:#d4a843;
            --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
            --shadow-sm:0 2px 8px rgba(0,0,0,0.06);
            --shadow-md:0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg:0 8px 32px rgba(0,0,0,0.1);
            --radius-sm:10px;
            --radius-md:16px;
            --radius-lg:22px;
            --radius-xl:28px;
            --radius-full:9999px;
            --font-caption:13px;
            --font-body:15px;
            --font-title:17px;
            --font-headline:20px;
            --font-large:28px;
            --font-massive:34px;
            --transition-fast:0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-smooth:0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        body {
            font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--bg-primary);
            color:var(--text-primary);
            overflow-x:hidden;
            min-height:100vh;
            min-height:100dvh;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            user-select:none;
            -webkit-user-select:none;
        }
        .app-container {
            max-width:430px;
            margin:0 auto;
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            flex-direction:column;
            position:relative;
            background:var(--bg-primary);
            padding-bottom:88px;
        }
        .main-content { flex:1; padding:0 16px; overflow-y:auto; scrollbar-width:none; }
        .main-content::-webkit-scrollbar { display:none; }

        /* Bottom Navigation */
        .bottom-nav {
            position:fixed;
            bottom:0;
            left:50%;
            transform:translateX(-50%);
            width:100%;
            max-width:430px;
            height:88px;
            background:rgba(255,255,255,0.88);
            backdrop-filter:blur(28px);
            -webkit-backdrop-filter:blur(28px);
            border-top:0.5px solid rgba(0,0,0,0.08);
            display:flex;
            align-items:flex-start;
            justify-content:space-around;
            padding:8px 8px env(safe-area-inset-bottom, 20px) 8px;
            z-index:100;
        }
        .nav-item {
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:3px;
            padding:6px 12px;
            border-radius:var(--radius-md);
            cursor:pointer;
            color:var(--text-tertiary);
            transition:var(--transition-fast);
            background:none;
            border:none;
            font-family:inherit;
            min-width:60px;
        }
        .nav-item.active { color:var(--accent); }
        .nav-item .nav-icon {
            font-size:24px;
            line-height:1;
            transition:var(--transition-fast);
            position:relative;
        }
        .nav-item .nav-label { font-size:10px; font-weight:600; letter-spacing:-0.1px; }
        .nav-item:active { transform:scale(0.94); }

        /* Page transitions */
        .page { animation:pageIn 0.35s cubic-bezier(0.25, 0.1, 0.25, 1); }
        @keyframes pageIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

        /* Typography */
        .section-header { display:flex; justify-content:space-between; align-items:center; margin:28px 0 14px 0; }
        .section-header h2 { font-size:var(--font-headline); font-weight:700; letter-spacing:-0.3px; }
        .section-link { color:var(--accent); font-size:var(--font-body); font-weight:500; cursor:pointer; }

        /* Home */
        .home-welcome { padding:24px 0 20px 0; }
        .home-welcome .greeting { font-size:var(--font-caption); color:var(--text-secondary); font-weight:500; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px; }
        .home-welcome h1 { font-size:var(--font-massive); font-weight:800; letter-spacing:-1px; line-height:1.1; }
        .home-menu { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:28px; }
        .home-menu-btn {
            background:var(--bg-secondary);
            border:none;
            border-radius:var(--radius-lg);
            padding:20px 16px;
            cursor:pointer;
            transition:var(--transition-fast);
            box-shadow:var(--shadow-xs);
            display:flex;
            flex-direction:column;
            gap:8px;
            font-family:inherit;
            text-align:left;
        }
        .home-menu-btn:active {
            transform:scale(0.97);
            background:var(--bg-tertiary);
            box-shadow:var(--shadow-sm);
        }
        .home-menu-btn .btn-icon {
            width:40px;
            height:40px;
            border-radius:var(--radius-sm);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
        }
        .home-menu-btn .btn-text { font-size:var(--font-body); font-weight:600; color:var(--text-primary); letter-spacing:-0.2px; }
        .icon-blue { background:#e8f1fb; color:#0071e3; }
        .icon-green { background:#e6f9ed; color:#30d158; }
        .icon-orange { background:#fff3e0; color:#ff9f0a; }
        .icon-purple { background:#f0ebf8; color:#8b6cfc; }
        .icon-gray { background:#f2f2f7; color:#6e6e73; }

        /* Promo page header */
        .promo-header { padding:20px 0 16px 0; }
        .promo-header h1 { font-size:var(--font-massive); font-weight:800; letter-spacing:-1px; }

        /* Search */
        .search-container {
            background:var(--bg-secondary);
            border-radius:var(--radius-full);
            padding:6px 6px 6px 16px;
            display:flex;
            align-items:center;
            margin-bottom:14px;
            box-shadow:var(--shadow-xs);
            transition:var(--transition-fast);
        }
        .search-container:focus-within { box-shadow:var(--shadow-md); }
        .search-icon { font-size:17px; color:var(--text-tertiary); margin-right:6px; }
        .search-input {
            flex:1;
            background:transparent;
            border:none;
            color:var(--text-primary);
            font-size:var(--font-body);
            padding:10px 0;
            outline:none;
            font-family:inherit;
        }
        .search-input::placeholder { color:var(--text-tertiary); }
        .search-clear {
            background:var(--bg-tertiary);
            border:none;
            color:var(--text-secondary);
            width:28px;
            height:28px;
            border-radius:50%;
            display:none;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            margin-right:4px;
            font-size:13px;
        }

        /* Filter chips */
        .filters-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; scrollbar-width:none; }
        .filters-scroll::-webkit-scrollbar { display:none; }
        .filter-chip {
            flex-shrink:0;
            background:var(--bg-secondary);
            border:1px solid transparent;
            border-radius:var(--radius-full);
            padding:8px 16px;
            font-size:var(--font-caption);
            font-weight:600;
            color:var(--text-secondary);
            cursor:pointer;
            transition:var(--transition-fast);
            box-shadow:var(--shadow-xs);
            font-family:inherit;
        }
        .filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 2px 8px rgba(0,113,227,0.3); }
        .filter-chip:active { transform:scale(0.95); }
        .filter-chip span { font-size:14px; margin-right:4px; vertical-align:middle; }

        /* Sort */
        .sort-container { display:flex; align-items:center; gap:6px; margin-bottom:14px; }
        .sort-label { font-size:var(--font-caption); color:var(--text-tertiary); font-weight:500; margin-right:2px; }
        .sort-btn {
            background:var(--bg-secondary);
            border:none;
            border-radius:var(--radius-full);
            padding:7px 14px;
            font-size:var(--font-caption);
            font-weight:600;
            color:var(--text-secondary);
            cursor:pointer;
            transition:var(--transition-fast);
            box-shadow:var(--shadow-xs);
            font-family:inherit;
        }
        .sort-btn.active { background:var(--text-primary); color:#fff; }
        .sort-btn:active { transform:scale(0.95); }

        /* Cards */
        .cards-grid { display:flex; flex-direction:column; gap:12px; padding-bottom:20px; }
        .promo-card {
            background:var(--bg-secondary);
            border-radius:var(--radius-xl);
            padding:20px;
            position:relative;
            box-shadow:var(--shadow-xs);
            transition:var(--transition-smooth);
            animation:cardUp 0.45s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            overflow:hidden;
        }
        @keyframes cardUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
        .promo-card:active { transform:scale(0.98); box-shadow:var(--shadow-md); }
        .vip-card { border:2px solid var(--vip-gold); box-shadow:0 0 0 4px rgba(212,168,67,0.1), var(--shadow-sm); }
        .promo-card-header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
        .promo-logo-container {
            width:52px;
            height:52px;
            border-radius:var(--radius-sm);
            overflow:hidden;
            background:var(--bg-tertiary);
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:var(--shadow-xs);
        }
        .promo-logo { width:100%; height:100%; object-fit:contain; padding:8px; }
        .promo-logo-fallback { font-size:20px; font-weight:700; color:var(--accent); }
        .promo-header-text { flex:1; min-width:0; }
        .promo-store { font-size:var(--font-title); font-weight:700; letter-spacing:-0.3px; }
        .promo-category { font-size:var(--font-caption); color:var(--text-tertiary); font-weight:500; }
        .promo-discount-badge {
            background:linear-gradient(135deg, #30d158, #28b84a);
            color:#fff;
            font-size:var(--font-headline);
            font-weight:800;
            padding:6px 14px;
            border-radius:var(--radius-full);
            letter-spacing:-0.5px;
        }
        .promo-body { margin-bottom:16px; }
        .promo-desc { font-size:var(--font-body); color:var(--text-secondary); line-height:1.4; }
        .promo-meta { display:flex; align-items:center; gap:16px; margin-top:8px; font-size:var(--font-caption); color:var(--text-tertiary); }
        .promo-date { display:flex; align-items:center; gap:4px; }
        .promo-stats { display:flex; align-items:center; gap:12px; }
        .promo-fav-btn {
            position:absolute;
            top:16px;
            right:16px;
            width:36px;
            height:36px;
            border-radius:50%;
            background:var(--bg-tertiary);
            border:none;
            cursor:pointer;
            font-size:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:2;
            transition:var(--transition-fast);
        }
        .promo-fav-btn:active { transform:scale(0.85); background:#fee2e2; }
        .get-btn {
            width:100%;
            background:var(--accent);
            border:none;
            color:#fff;
            padding:14px;
            border-radius:var(--radius-md);
            font-weight:600;
            font-size:var(--font-body);
            cursor:pointer;
            font-family:inherit;
            transition:var(--transition-fast);
            letter-spacing:-0.2px;
            box-shadow:0 4px 14px rgba(0,113,227,0.25);
        }
        .get-btn:active { background:var(--accent-hover); transform:scale(0.98); }
        .promo-new-badge {
            position:absolute;
            top:16px;
            left:16px;
            background:var(--danger);
            color:#fff;
            font-size:11px;
            font-weight:700;
            padding:4px 10px;
            border-radius:var(--radius-full);
            z-index:2;
            letter-spacing:0.3px;
        }
        .promo-vip-badge {
            position:absolute;
            top:56px;
            left:16px;
            background:var(--vip-gold);
            color:#fff;
            font-size:11px;
            font-weight:700;
            padding:4px 10px;
            border-radius:var(--radius-full);
            z-index:2;
            display:none;
        }
        .vip-card .promo-vip-badge { display:block; }
        .vip-card .get-btn { background:linear-gradient(135deg, #d4a843, #b8902d); box-shadow:0 4px 14px rgba(212,168,67,0.3); }

        /* Auth */
        .auth-page { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; background:var(--bg-primary); }
        .auth-card { width:100%; max-width:380px; background:var(--bg-secondary); border-radius:var(--radius-xl); padding:32px 24px; box-shadow:var(--shadow-lg); }
        .auth-title { font-size:var(--font-massive); font-weight:800; text-align:center; margin-bottom:24px; letter-spacing:-1px; }
        .auth-input {
            width:100%;
            background:var(--bg-primary);
            border:1px solid transparent;
            border-radius:var(--radius-md);
            padding:14px 16px;
            color:var(--text-primary);
            font-size:var(--font-body);
            margin-bottom:12px;
            outline:none;
            font-family:inherit;
            transition:var(--transition-fast);
        }
        .auth-input:focus { border-color:var(--accent); background:var(--bg-secondary); }
        .auth-input::placeholder { color:var(--text-tertiary); }
        .auth-btn {
            width:100%;
            background:var(--accent);
            border:none;
            border-radius:var(--radius-md);
            padding:15px;
            color:#fff;
            font-weight:600;
            font-size:var(--font-body);
            cursor:pointer;
            margin-top:8px;
            font-family:inherit;
            box-shadow:0 4px 14px rgba(0,113,227,0.25);
            transition:var(--transition-fast);
        }
        .auth-btn:active { background:var(--accent-hover); }
        .auth-link { color:var(--accent); text-align:center; margin-top:18px; cursor:pointer; font-size:var(--font-body); font-weight:500; }
        .auth-error { color:var(--danger); font-size:var(--font-caption); margin-bottom:8px; text-align:center; }
        .auth-checkbox { display:flex; align-items:center; gap:8px; font-size:var(--font-caption); color:var(--text-secondary); margin-bottom:14px; }
        .auth-checkbox input { accent-color:var(--accent); width:18px; height:18px; }

        /* Profile */
        .profile-card { background:var(--bg-secondary); border-radius:var(--radius-xl); padding:32px 24px; text-align:center; box-shadow:var(--shadow-xs); }
        .profile-avatar { width:72px; height:72px; border-radius:50%; background:var(--bg-tertiary); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:32px; }
        .profile-name { font-size:var(--font-headline); font-weight:700; }
        .profile-login { font-size:var(--font-body); color:var(--text-tertiary); margin-top:2px; }
        .logout-btn {
            width:100%;
            margin-top:24px;
            background:#fee2e2;
            border:none;
            color:var(--danger);
            padding:14px;
            border-radius:var(--radius-md);
            font-weight:600;
            cursor:pointer;
            font-size:var(--font-body);
            font-family:inherit;
            transition:var(--transition-fast);
        }
        .logout-btn:active { background:#fcc; }

        .empty-state { text-align:center; padding:48px 20px; color:var(--text-tertiary); font-size:var(--font-body); }
        .toast-container { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; width:calc(100% - 32px); max-width:400px; }
        .toast {
            background:var(--text-primary);
            color:#fff;
            border-radius:var(--radius-full);
            padding:12px 20px;
            text-align:center;
            font-size:var(--font-body);
            font-weight:600;
            animation:toastIn 0.35s ease;
            box-shadow:var(--shadow-lg);
        }
        @keyframes toastIn { from{opacity:0;transform:translateY(-12px);} to{opacity:1;transform:translateY(0);} }

        .back-btn {
            background:var(--bg-secondary);
            border:none;
            border-radius:var(--radius-full);
            padding:10px 18px;
            color:var(--accent);
            font-weight:600;
            font-size:var(--font-body);
            cursor:pointer;
            font-family:inherit;
            margin-bottom:16px;
            box-shadow:var(--shadow-xs);
            transition:var(--transition-fast);
        }
        .back-btn:active { transform:scale(0.96); }
    </style>
</head>
<body>
    <div id="app" class="app-container">
        <main id="main-content" class="main-content"></main>
        <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>

    <script>
        var CONFIG = {
            GOOGLE_SHEET_ID: '1Wtv4kA1W_hb4bvjyc7ruecrVw5s4Gh-TBQR1PRJYo2c',
            API_KEY: 'AIzaSyAbTbin2-mkFRspURGKRXxyCpjy_Dez8ts',
            SHEET_OFFERS: 'Акции',
            SHEET_USERS: 'Пользователи',
            APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzQSmlFHGoD3YMPlCyrLFOKZ_J1xacgSljT6iQ6uzRvb1DF3aIUXJyCfjTImEnh368D/exec',
            COLUMNS: { ID:0, STORE:1, CATEGORY:2, DISCOUNT:3, DESCRIPTION:4, LINK:5, LOGO:6, VIP:7, ACTIVE:8, DATE:9 }
        };

        var Storage = {
            get: function(key) { try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; } },
            set: function(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} },
            remove: function(key) { try { localStorage.removeItem(key); } catch(e) {} }
        };

        var Session = {
            KEY: 'max_user_session',
            save: function(user, remember) { Storage.set(this.KEY, user); },
            get: function() { return Storage.get(this.KEY); },
            logout: function() { Storage.remove(this.KEY); }
        };

        function userKey(baseKey) { var u = Session.get(); return u ? `${u.login}_${baseKey}` : baseKey; }

        var Stats = {
            key: function() { return userKey('max_stats'); },
            all: function() { return Storage.get(this.key()) || {}; },
            save: function(s) { Storage.set(this.key(), s); },
            view: function(id) { var s = this.all(); if(!s[id]) s[id]={views:0,clicks:0,favs:0}; s[id].views++; this.save(s); },
            click: function(id) { var s = this.all(); if(!s[id]) s[id]={views:0,clicks:0,favs:0}; s[id].clicks++; this.save(s); },
            fav: function(id, added) { var s = this.all(); if(!s[id]) s[id]={views:0,clicks:0,favs:0}; added?s[id].favs++:s[id].favs=Math.max(0,s[id].favs-1); this.save(s); },
            get: function(id) { return this.all()[id] || {views:0,clicks:0,favs:0}; }
        };

        var Favorites = {
            key: function() { return userKey('max_favs'); },
            list: function() { return Storage.get(this.key()) || []; },
            save: function(l) { Storage.set(this.key(), l); },
            is: function(id) { return this.list().indexOf(id) > -1; },
            toggle: function(id) { var l=this.list(); var i=l.indexOf(id); var a=false; if(i>-1){l.splice(i,1);}else{l.push(id);a=true;} this.save(l); Stats.fav(id,a); return a; }
        };

        var API = {
            offers:[], categories:[], users:[],
            loadOffers:function(){
                var s=this;
                return fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.GOOGLE_SHEET_ID}/values/${CONFIG.SHEET_OFFERS}?key=${CONFIG.API_KEY}`)
                .then(r=>r.json()).then(d=>{
                    if(!d.values||d.values.length<2) throw new Error('Нет данных');
                    var rows=d.values.slice(1);
                    s.offers=rows.filter(r=>r[CONFIG.COLUMNS.STORE]&&r[CONFIG.COLUMNS.ACTIVE]?.toLowerCase().trim()==='да')
                    .map((r,i)=>({id:r[CONFIG.COLUMNS.ID]||(i+1),store:r[CONFIG.COLUMNS.STORE],category:r[CONFIG.COLUMNS.CATEGORY]||'',discount:r[CONFIG.COLUMNS.DISCOUNT]||'',description:r[CONFIG.COLUMNS.DESCRIPTION]||'',link:r[CONFIG.COLUMNS.LINK]||'#',logo:r[CONFIG.COLUMNS.LOGO]||'',isVip:r[CONFIG.COLUMNS.VIP]&&r[CONFIG.COLUMNS.VIP].toLowerCase().trim()==='да',date:r[CONFIG.COLUMNS.DATE]||''}));
                    s.categories=s.buildCategories(s.offers); return s.offers;
                });
            },
            loadUsers:function(){
                var s=this;
                return fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.GOOGLE_SHEET_ID}/values/${CONFIG.SHEET_USERS}?key=${CONFIG.API_KEY}`)
                .then(r=>r.json()).then(d=>{
                    if(!d.values||d.values.length<2){s.users=[];return[];}
                    s.users=d.values.slice(1).map(r=>({id:r[0],login:r[1],password:r[2],name:r[3],role:r[4]||'user'}));
                    return s.users;
                });
            },
            buildCategories:function(o){
                var c=[{id:'all',name:'Все',emoji:'🔥'}];
                var m={'еда':'🍕','маркетплейсы':'📦','банки':'💳','связь':'📱','игры':'🎮','путешествия':'✈️','магазины':'🏪','авто':'🚗'};
                var set={};
                o.forEach(x=>{var k=x.category.toLowerCase().trim(); if(k&&!set[k]){set[k]=true;c.push({id:k,name:x.category,emoji:m[k]||'📌'});}});
                return c;
            },
            filter:function(cat,sort,query){
                var f=this.offers.slice();
                if(cat&&cat!=='all') f=f.filter(o=>o.category.toLowerCase()===cat);
                if(query){var q=query.toLowerCase(); f=f.filter(o=>o.store.toLowerCase().indexOf(q)>-1||o.description.toLowerCase().indexOf(q)>-1);}
                if(sort==='popular') f.sort((a,b)=>(Stats.get(b.id).views||0)-(Stats.get(a.id).views||0));
                else if(sort==='discount') f.sort((a,b)=>(parseInt(b.discount)||0)-(parseInt(a.discount)||0));
                else f.sort((a,b)=>b.id-a.id);
                return f;
            },
            registerUser:function(l,p,n){
                return fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({login:l,password:p,name:n})}).then(r=>r.json());
            }
        };

        var App = {
            currentScreen:'home', activeCategory:'all', activeSort:'new', searchQuery:'',
            init:function(){
                this.content=document.getElementById('main-content');
                this.nav=document.getElementById('bottom-nav');
                var u=Session.get();
                if(u){this.nav.style.display='flex';this.loadApp();}
                else{this.nav.style.display='none';this.showAuthScreen('login');}
            },
            loadApp:function(){
                var s=this; this.showLoader();
                API.loadOffers().then(()=>{s.renderScreen('home');}).catch(e=>{s.content.innerHTML='<div class="empty-state"><p>❌ Ошибка загрузки</p><p>'+e.message+'</p></div>';s.renderNav();});
            },
            showLoader:function(){this.content.innerHTML='<div style="text-align:center;padding:60px;color:var(--text-tertiary);">Загрузка...</div>';},
            showAuthScreen:function(m){
                var s=this; this.nav.style.display='none';
                var h='<div class="auth-page"><div class="auth-card"><div class="auth-title">'+(m==='login'?'Вход':'Регистрация')+'</div><div class="auth-error" id="authError"></div>'+(m==='register'?'<input class="auth-input" id="regName" placeholder="Имя">':'')+'<input class="auth-input" id="authLogin" placeholder="Логин"><input class="auth-input" type="password" id="authPassword" placeholder="Пароль">'+(m==='login'?'<label class="auth-checkbox"><input type="checkbox" id="rememberMe" checked> Запомнить меня</label>':'')+'<button class="auth-btn" id="authBtn">'+(m==='login'?'Войти':'Зарегистрироваться')+'</button><div class="auth-link" id="switchAuth">'+(m==='login'?'Нет аккаунта? Зарегистрироваться':'Есть аккаунт? Войти')+'</div></div></div>';
                this.content.innerHTML=h;
                document.getElementById('switchAuth').onclick=function(){s.showAuthScreen(m==='login'?'register':'login');};
                document.getElementById('authBtn').onclick=function(){
                    var l=document.getElementById('authLogin').value.trim();
                    var p=document.getElementById('authPassword').value.trim();
                    var n=m==='register'?document.getElementById('regName')?.value.trim():'';
                    if(!l||!p||(m==='register'&&!n)){document.getElementById('authError').textContent='Заполните все поля';return;}
                    if(m==='login'){
                        s.showLoader(); API.loadUsers().then(u=>{
                            var f=u.find(x=>x.login===l&&x.password===p);
                            if(f){var r=document.getElementById('rememberMe')?.checked||false; Session.save(f,r); s.nav.style.display='flex'; s.loadApp();}
                            else{s.showAuthScreen('login');setTimeout(()=>{document.getElementById('authError').textContent='Неверный логин или пароль';},100);}
                        }).catch(()=>{s.showAuthScreen('login');setTimeout(()=>{document.getElementById('authError').textContent='Ошибка сети';},100);});
                    }else{
                        document.getElementById('authBtn').disabled=true; document.getElementById('authBtn').textContent='Отправка...';
                        API.registerUser(l,p,n).then(r=>{
                            if(r.success){var u={login:l,password:p,name:n,role:'user'}; Session.save(u,true); s.nav.style.display='flex'; s.loadApp();}
                            else{document.getElementById('authError').textContent=r.error||'Ошибка регистрации'; document.getElementById('authBtn').disabled=false; document.getElementById('authBtn').textContent='Зарегистрироваться';}
                        }).catch(()=>{document.getElementById('authError').textContent='Ошибка соединения'; document.getElementById('authBtn').disabled=false; document.getElementById('authBtn').textContent='Зарегистрироваться';});
                    }
                };
            },
            renderScreen:function(s){
                this.currentScreen=s; this.content.innerHTML='';
                if(s==='home') this.renderHomePage();
                else if(s==='promotions') this.renderPromotionsPage();
                else if(s==='favorites') this.renderFavoritesPage();
                else if(s==='profile') this.renderProfilePage();
                else if(s==='notifications') this.renderPlaceholder('Уведомления','Здесь будут уведомления');
                this.renderNav();
            },
            renderHomePage:function(){
                var s=this, u=Session.get();
                var h='<div class="page"><div class="home-welcome"><div class="greeting">Доброе утро</div><h1>'+(u?.name||u?.login||'Гость')+'</h1></div>';
                h+='<div class="home-menu"><div class="home-menu-btn" data-target="promotions"><div class="btn-icon icon-blue">🎯</div><div class="btn-text">Акции</div></div><div class="home-menu-btn" data-target="discounts"><div class="btn-icon icon-green">💰</div><div class="btn-text">Скидки</div></div><div class="home-menu-btn" data-target="offers"><div class="btn-icon icon-orange">🔥</div><div class="btn-text">Выгодные<br>предложения</div></div><div class="home-menu-btn" data-target="partners"><div class="btn-icon icon-purple">🤝</div><div class="btn-text">Партнеры</div></div><div class="home-menu-btn" data-target="about"><div class="btn-icon icon-gray">ℹ️</div><div class="btn-text">О нас</div></div></div>';
                h+='<div class="section-header"><h2>Последние акции</h2><span class="section-link" id="goToPromo">Все →</span></div><div id="homeLatestCards" class="cards-grid"></div></div>';
                this.content.innerHTML=h;
                document.getElementById('goToPromo').onclick=function(){s.renderScreen('promotions');};
                var btns=this.content.querySelectorAll('.home-menu-btn');
                btns.forEach(b=>{b.addEventListener('click',function(){var t=this.dataset.target; if(t==='promotions') s.renderScreen('promotions'); else s.showToast('Раздел «'+this.querySelector('.btn-text').textContent.replace(/\n/g,' ')+'» в разработке');});});
                var latest=API.filter('all','new','').slice(0,3);
                var c=document.getElementById('homeLatestCards');
                if(latest.length===0){c.innerHTML='<div class="empty-state">Пока нет акций</div>';}
                else{
                    latest.forEach((o,i)=>{
                        var card=document.createElement('div');
                        card.className='promo-card'+(o.isVip?' vip-card':'');
                        card.style.animationDelay=i*0.05+'s';
                        card.innerHTML='<div class="promo-card-header"><div class="promo-logo-container">'+(o.logo?'<img class="promo-logo" src="'+o.logo+'">':'<span class="promo-logo-fallback">'+o.store.charAt(0)+'</span>')+'</div><div class="promo-header-text"><div class="promo-store">'+o.store+'</div></div><div class="promo-discount-badge">'+o.discount+'</div></div><div class="promo-body"><div class="promo-desc">'+o.description+'</div><div class="promo-meta"><span class="promo-date">⏳ до '+o.date+'</span></div></div><button class="get-btn" data-link="'+o.link+'" data-id="'+o.id+'">Получить</button>'+(o.isVip?'<div class="promo-vip-badge">VIP</div>':'');
                        c.appendChild(card);
                    });
                }
                this.attachCardEvents(c);
            },
            renderPromotionsPage:function(){
                var s=this;
                var h='<div class="page"><div class="promo-header"><h1>Акции</h1></div><div class="search-container"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" placeholder="Поиск акций..." value="'+this.searchQuery+'"><button class="search-clear" id="clearSearch">✕</button></div><div class="filters-scroll" id="filtersScroll"></div><div class="sort-container"><span class="sort-label">Сортировка</span><button class="sort-btn active" data-sort="new">Новые</button><button class="sort-btn" data-sort="popular">Популярные</button><button class="sort-btn" data-sort="discount">Макс. скидка</button></div><div id="cardsContainer"></div></div>';
                this.content.innerHTML=h;
                var inp=document.getElementById('searchInput'), clr=document.getElementById('clearSearch');
                inp.addEventListener('input',function(){clr.style.display=this.value?'flex':'none';s.searchQuery=this.value;s.renderCards();});
                clr.addEventListener('click',function(){inp.value='';clr.style.display='none';s.searchQuery='';s.renderCards();});
                clr.style.display=inp.value?'flex':'none';
                this.renderFilters(); this.renderSort(); this.renderCards();
            },
            renderFilters:function(){
                var c=document.getElementById('filtersScroll'); c.innerHTML=''; var s=this;
                API.categories.forEach(cat=>{
                    var chip=document.createElement('button');
                    chip.className='filter-chip'+(cat.id===s.activeCategory?' active':'');
                    chip.innerHTML='<span>'+cat.emoji+'</span>'+cat.name;
                    chip.onclick=function(){s.activeCategory=cat.id;s.renderFilters();s.renderCards();};
                    c.appendChild(chip);
                });
            },
            renderSort:function(){
                var btns=document.querySelectorAll('.sort-btn'); var s=this;
                btns.forEach(b=>{b.classList.remove('active');if(b.dataset.sort===s.activeSort)b.classList.add('active');b.onclick=function(){s.activeSort=this.dataset.sort;s.renderSort();s.renderCards();};});
            },
            renderCards:function(){
                var c=document.getElementById('cardsContainer');
                var offers=API.filter(this.activeCategory,this.activeSort,this.searchQuery);
                if(offers.length===0){c.innerHTML='<div class="empty-state">Ничего не найдено</div>';return;}
                var sortedIds=offers.map(o=>o.id).sort((a,b)=>b-a);
                var newThreshold=sortedIds[Math.min(2,sortedIds.length-1)];
                var h='<div class="cards-grid">';
                offers.forEach((o,i)=>{
                    var stats=Stats.get(o.id), isNew=o.id>=newThreshold;
                    h+='<div class="promo-card'+(o.isVip?' vip-card':'')+'" style="animation-delay:'+i*0.05+'s">';
                    if(isNew) h+='<div class="promo-new-badge">NEW</div>';
                    if(o.isVip) h+='<div class="promo-vip-badge">VIP</div>';
                    h+='<button class="promo-fav-btn" data-id="'+o.id+'">'+(Favorites.is(o.id)?'❤️':'🤍')+'</button>';
                    h+='<div class="promo-card-header"><div class="promo-logo-container">'+(o.logo?'<img class="promo-logo" src="'+o.logo+'">':'<span class="promo-logo-fallback">'+o.store.charAt(0)+'</span>')+'</div><div class="promo-header-text"><div class="promo-store">'+o.store+'</div></div><div class="promo-discount-badge">'+o.discount+'</div></div>';
                    h+='<div class="promo-body"><div class="promo-desc">'+o.description+'</div><div class="promo-meta"><span class="promo-date">⏳ до '+o.date+'</span><span class="promo-stats">👁 '+stats.views+' 🔗 '+stats.clicks+'</span></div></div>';
                    h+='<button class="get-btn" data-link="'+o.link+'" data-id="'+o.id+'">Получить</button></div>';
                });
                h+='</div>'; c.innerHTML=h;
                this.attachCardEvents(c);
            },
            attachCardEvents:function(c){
                c.querySelectorAll('.get-btn').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();Stats.click(parseInt(this.dataset.id));window.open(this.dataset.link,'_blank');});});
                c.querySelectorAll('.promo-fav-btn').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();var id=parseInt(this.dataset.id);var a=Favorites.toggle(id);this.innerHTML=a?'❤️':'🤍';App.showToast(a?'Добавлено в избранное':'Удалено');});});
                c.querySelectorAll('.promo-card').forEach(card=>{var id=parseInt(card.querySelector('.promo-fav-btn')?.dataset.id);if(id)Stats.view(id);});
            },
            renderFavoritesPage:function(){
                var s=this;
                var h='<div class="page"><div class="promo-header"><h1>Избранное</h1></div><button class="back-btn" id="backFromFav">← Назад</button><div id="favContainer"></div></div>';
                this.content.innerHTML=h;
                document.getElementById('backFromFav').onclick=function(){s.renderScreen('promotions');};
                var favIds=Favorites.list();
                var offers=API.offers.filter(o=>favIds.indexOf(o.id)>-1);
                var c=document.getElementById('favContainer');
                if(offers.length===0){c.innerHTML='<div class="empty-state">Нет избранных акций</div>';return;}
                var cards='<div class="cards-grid">';
                offers.forEach(o=>{var stats=Stats.get(o.id);cards+='<div class="promo-card'+(o.isVip?' vip-card':'')+'">'+(o.isVip?'<div class="promo-vip-badge">VIP</div>':'')+'<button class="promo-fav-btn" data-id="'+o.id+'">❤️</button><div class="promo-card-header"><div class="promo-logo-container">'+(o.logo?'<img class="promo-logo" src="'+o.logo+'">':'<span class="promo-logo-fallback">'+o.store.charAt(0)+'</span>')+'</div><div class="promo-header-text"><div class="promo-store">'+o.store+'</div></div><div class="promo-discount-badge">'+o.discount+'</div></div><div class="promo-body"><div class="promo-desc">'+o.description+'</div><div class="promo-meta"><span class="promo-date">⏳ до '+o.date+'</span><span class="promo-stats">👁 '+stats.views+' 🔗 '+stats.clicks+'</span></div></div><button class="get-btn" data-link="'+o.link+'" data-id="'+o.id+'">Получить</button></div>';});
                cards+='</div>'; c.innerHTML=cards;
                c.querySelectorAll('.get-btn').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();Stats.click(parseInt(this.dataset.id));window.open(this.dataset.link,'_blank');});});
                c.querySelectorAll('.promo-fav-btn').forEach(b=>{b.addEventListener('click',function(e){e.stopPropagation();Favorites.toggle(parseInt(this.dataset.id));s.renderFavoritesPage();s.showToast('Удалено из избранного');});});
            },
            renderProfilePage:function(){
                var u=Session.get(); if(!u){this.showAuthScreen('login');return;}
                var h='<div class="page"><div class="promo-header"><h1>Профиль</h1></div><div class="profile-card"><div class="profile-avatar">👤</div><div class="profile-name">'+(u.name||u.login)+'</div><div class="profile-login">@'+u.login+'</div><button class="logout-btn" id="logoutBtn">Выйти</button></div></div>';
                this.content.innerHTML=h; var s=this;
                document.getElementById('logoutBtn').onclick=function(){Session.logout();s.nav.style.display='none';s.showAuthScreen('login');};
            },
            renderPlaceholder:function(t,text){this.content.innerHTML='<div class="page"><div class="promo-header"><h1>'+t+'</h1></div><div class="empty-state">'+text+'</div></div>';},
            renderNav:function(){
                var s=this;
                var items=[{id:'home',icon:'🏠',label:'Главная'},{id:'promotions',icon:'🎯',label:'Акции'},{id:'favorites',icon:'❤️',label:'Избранное'},{id:'notifications',icon:'🔔',label:'Увед'},{id:'profile',icon:'👤',label:'Профиль'}];
                this.nav.innerHTML='';
                items.forEach(item=>{
                    var el=document.createElement('button');
                    el.className='nav-item'+(s.currentScreen===item.id?' active':'');
                    el.innerHTML='<span class="nav-icon">'+item.icon+'</span><span class="nav-label">'+item.label+'</span>';
                    el.addEventListener('click',function(){s.renderScreen(item.id);});
                    s.nav.appendChild(el);
                });
            },
            showToast:function(msg){
                var c=document.querySelector('.toast-container');
                if(!c){c=document.createElement('div');c.className='toast-container';document.body.appendChild(c);}
                var t=document.createElement('div'); t.className='toast'; t.textContent=msg; c.appendChild(t);
                setTimeout(function(){t.style.opacity='0';t.style.transform='translateY(-8px)';setTimeout(function(){t.remove();},300);},2000);
            }
        };

        document.addEventListener('DOMContentLoaded', function(){ App.init(); });
    </script>
</body>
</html>
