<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e18"><title>COLLECT — твоя коллекция</title>
<style>
:root{color-scheme:dark;--bg:#080d13;--surface:#111a24;--surface2:#182431;--surface3:#202e3d;--line:#ffffff14;--text:#f3f7f8;--muted:#8d9ba8;--accent:#c8f36a;--accent2:#8ed8c4;--purple:#a99aff;--gold:#f0cb79;--pink:#e9a2c6;--green:#91ddb4;--shadow:0 18px 50px #0005}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -24%,#263d3c66,transparent 48%),radial-gradient(ellipse at 100% 36%,#25334a35,transparent 35%),var(--bg);min-height:100vh;letter-spacing:-.01em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(to bottom,#000,transparent 72%);z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:620px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(106px + env(safe-area-inset-bottom))}
.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0b}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#d9ff91,#8cbd48);display:grid;place-items:center;font-size:22px;color:#17220c;box-shadow:0 8px 24px #b9ed6130}
.brand strong{font-size:16px;letter-spacing:2px;font-weight:950}
.brand small{display:block;color:var(--accent);font-size:8px;letter-spacing:1.8px;font-weight:850;margin-top:4px}
.avatar{width:42px;height:42px;border:1px solid #ffffff20;border-radius:15px;background:linear-gradient(145deg,#1c2a36,#101820);font-size:19px;transition:.2s}
.avatar:active{transform:scale(.94);border-color:var(--accent)}
#main{padding-top:14px;animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.title{font-size:clamp(28px,7vw,35px);letter-spacing:-1.5px;font-weight:900;line-height:1.05;margin:17px 0 8px}
.subtitle{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 22px;max-width:490px}
.eyebrow{font-size:9px;font-weight:950;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
.hero{position:relative;overflow:hidden;border-radius:26px;border:1px solid #d5ff8b2b;padding:23px;background:radial-gradient(circle at 92% 20%,#c9f36a1d,transparent 34%),linear-gradient(135deg,#1d302d,#17252a 54%,#18202c);margin:18px 0 17px;box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-62px;bottom:-115px;border:1px solid #d5ff8b30;box-shadow:0 0 0 17px #d5ff8b08,0 0 0 36px #d5ff8b06}
.hero:after{content:"✦";position:absolute;right:22px;top:14px;font-size:82px;color:#d9ff9117;pointer-events:none}
.hero h2{font-size:clamp(23px,6vw,30px);line-height:1.08;max-width:78%;margin:12px 0 9px;letter-spacing:-.9px;font-weight:900;position:relative;z-index:1}
.hero p{font-size:12px;line-height:1.65;color:#b6c6c2;max-width:78%;margin:0;position:relative;z-index:1}
.btn{border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#d8ff91,#a9d85b);color:#17220d;font-size:12px;font-weight:950;box-shadow:0 9px 24px #b9ed6125;transition:transform .18s,filter .18s}
.btn:active,.buy:active{transform:translateY(1px) scale(.985);filter:brightness(.96)}
.btn.secondary{background:#253542;border:1px solid #ffffff13;color:#e9f1f3;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid #ffffff24;box-shadow:none;color:var(--muted)}
.btn.full{width:100%}
.hero .btn{margin-top:18px;position:relative;z-index:1;min-width:190px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0 25px}
.stat{padding:15px 13px;border-radius:18px;background:linear-gradient(145deg,#172430,#111a23);border:1px solid var(--line);box-shadow:0 8px 25px #0002;min-width:0}
.stat b{font-size:23px;letter-spacing:-1px;display:block;color:#f5f9f7;white-space:nowrap}
.stat span{font-size:9px;line-height:1.4;color:var(--muted);display:block;margin-top:5px}
.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.section h3{font-size:16px;margin:0;font-weight:850;letter-spacing:-.35px}
.section button{border:0;background:none;color:var(--accent);font-size:11px;font-weight:850;padding:7px 0}
.section .tag{flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{border:1px solid #ffffff16;border-radius:18px;padding:8px;background:linear-gradient(155deg,#1b2936,#111a23);min-width:0;text-align:left;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,background .2s;box-shadow:0 8px 20px #0002}
.card:active{transform:scale(.975)}
.card:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.art{height:clamp(92px,25vw,126px);border-radius:12px;display:grid;place-items:center;font-size:clamp(39px,11vw,52px);background:radial-gradient(circle at 50% 25%,#ffffff35,transparent 55%),linear-gradient(145deg,var(--a),var(--b));position:relative;overflow:hidden}
.art:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#ffffff1d,transparent 40%,#0002)}
.art:after{content:"";position:absolute;inset:6px;border:1px solid #ffffff35;border-radius:8px}
.rarity{position:absolute;top:7px;left:7px;z-index:1;border-radius:20px;background:#081018d9;padding:5px 7px;font-size:7px;font-weight:950;letter-spacing:.3px;backdrop-filter:blur(8px)}
.copies{position:absolute;top:7px;right:7px;z-index:1;border-radius:20px;background:#081018d9;padding:5px 7px;font-size:8px;font-weight:850}
.card strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:9px 2px 4px}
.card small{font-size:8px;color:var(--muted);display:block;margin:0 2px 3px}
.locked .art{filter:grayscale(.9) brightness(.43)}
.locked strong{color:#82909d}
.wide{display:flex;gap:13px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(145deg,#172430,#111a23);border:1px solid var(--line);margin:9px 0;box-shadow:0 7px 20px #0002;min-width:0}
.wideicon{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#2c413d,#1b2c2b);border:1px solid #c8f36a1b;display:grid;place-items:center;font-size:21px;flex-shrink:0}
.widecopy{flex:1;min-width:0}
.widecopy b{font-size:12px;display:block;font-weight:850;line-height:1.35}
.widecopy small{font-size:10px;color:var(--muted);line-height:1.5;display:block;margin-top:5px}
.tag{font-size:9px;padding:7px 9px;border-radius:20px;background:#c8f36a14;color:var(--accent);border:1px solid #c8f36a24;white-space:nowrap;font-weight:850}
.progress{height:7px;background:#ffffff13;border-radius:10px;overflow:hidden;margin-top:10px}
.progress i{height:100%;display:block;border-radius:10px;background:linear-gradient(90deg,#c8f36a,#8ed8c4);box-shadow:0 0 12px #c8f36a55}
.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0 16px;padding:2px 0 5px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1px solid #ffffff17;border-radius:12px;padding:9px 13px;background:#111a24;font-size:10px;color:var(--muted);font-weight:800;transition:.2s}
.tabs button.active{background:#c8f36a;color:#17220d;border-color:#c8f36a;box-shadow:0 5px 16px #c8f36a22}
.product{background:linear-gradient(145deg,#1a2935,#111a23);border:1px solid #ffffff16;border-radius:21px;padding:14px;margin:11px 0;display:flex;gap:13px;align-items:center;box-shadow:0 8px 24px #0002;transition:border-color .2s}
.product:active{border-color:#c8f36a55}
.productart{width:72px;height:82px;flex-shrink:0;border-radius:16px;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 50% 25%,#ffffff2b,transparent 55%),linear-gradient(145deg,#38554b,#253044);border:1px solid #ffffff1a}
.productinfo{flex:1;min-width:0}
.productinfo b{font-size:13px;font-weight:900}
.productinfo p{font-size:10px;line-height:1.5;color:var(--muted);margin:6px 0}
.price{font-size:14px;font-weight:950;color:var(--accent)}
.buy{padding:10px 13px;border:1px solid #c8f36a2a;border-radius:12px;background:#c8f36a;color:#18220e;font-size:10px;font-weight:950;white-space:nowrap;transition:.18s}
.buy:disabled{opacity:.35;cursor:not-allowed}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0d151dec;backdrop-filter:blur(22px);border-top:1px solid #ffffff14;z-index:5;box-shadow:0 -12px 36px #0004}
.nav button{background:none;border:0;color:#788995;font-size:9px;font-weight:850;padding:7px 4px 5px;border-radius:13px;transition:.2s}
.nav button span{display:block;font-size:20px;margin-bottom:5px;line-height:1}
.nav button.active{color:var(--accent);background:#c8f36a10}
.overlay{display:none;position:fixed;inset:0;z-index:20;background:#03070bd9;backdrop-filter:blur(10px);align-items:flex-end;justify-content:center;padding:10px}
.overlay.show{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:540px;max-height:90vh;overflow:auto;border-radius:28px 28px 20px 20px;background:linear-gradient(155deg,#1c2b37,#111a24 65%);border:1px solid #ffffff1d;padding:20px 18px calc(20px + env(safe-area-inset-bottom));text-align:center;box-shadow:var(--shadow)}
.modal h3{font-size:21px;letter-spacing:-.6px;margin:8px 0;font-weight:900}
.modal p{font-size:12px;line-height:1.65;color:#9cabb5}
.bigart{width:150px;height:150px;margin:16px auto;border-radius:27px;display:grid;place-items:center;font-size:80px;background:radial-gradient(circle at 50% 20%,#ffffff35,transparent 60%),linear-gradient(145deg,var(--a),var(--b));border:1px solid #ffffff3d;box-shadow:0 14px 35px #0004}
.close{float:right;border:1px solid #ffffff18;border-radius:12px;width:34px;height:34px;background:#ffffff0b;font-size:19px;color:#a9b7c0}
.actions{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap}
.actions>*{flex:1;min-width:110px}
.empty{grid-column:1/-1;border:1px dashed #ffffff27;border-radius:19px;text-align:center;padding:28px 17px;color:var(--muted);font-size:12px;line-height:1.6;background:#ffffff04}
.note{font-size:9px;line-height:1.6;color:#71818e;text-align:center;margin:19px 8px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--accent);color:#15200b;border-radius:15px;padding:12px 17px;font-size:11px;font-weight:950;z-index:40;box-shadow:0 10px 30px #0008;max-width:90%;text-align:center}
.hide{display:none!important}
.premium{background:radial-gradient(circle at 100% 0,#f0cb7922,transparent 45%),linear-gradient(135deg,#342b20,#1c2027);border:1px solid #f0cb7944;border-radius:22px;padding:18px;margin:17px 0}
.premium b{color:#f3d795;font-size:14px;font-weight:950}
.premium p{font-size:11px;line-height:1.6;color:#c6b99f}
.premium .btn{background:linear-gradient(135deg,#f4d994,#c38c45);color:#24190c;box-shadow:none}
.foot{font-size:9px;color:#7c8b96;text-align:center;line-height:1.6;margin:20px 4px}
.search{width:100%;border:1px solid #ffffff1c;border-radius:15px;background:#111a24;padding:15px 16px;color:var(--text);font:inherit;font-size:12px;outline:none;margin:5px 0 13px;transition:.2s}
.search:focus{border-color:#c8f36a88;box-shadow:0 0 0 3px #c8f36a12}
.achievement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:11px 0 17px}
.achievement{background:linear-gradient(145deg,#172430,#111a23);border:1px solid #ffffff14;border-radius:18px;padding:14px;min-height:118px;display:flex;flex-direction:column;gap:6px}
.achievement span{font-size:23px}
.achievement b{font-size:12px;font-weight:900}
.achievement small{font-size:9px;line-height:1.45;color:var(--muted)}
.achievement em{font-style:normal;font-size:8px;color:#84939d;margin-top:auto;font-weight:850}
.achievement.done{border-color:#c8f36a4c;background:linear-gradient(145deg,#24372e,#17251f)}
.achievement.done em{color:var(--accent)}
@media(min-width:520px){.app{padding-left:24px;padding-right:24px}.overlay{align-items:center}.modal{border-radius:26px}.grid{gap:12px}.art{height:132px}}
@media(max-width:370px){.app{padding-left:13px;padding-right:13px}.stats{gap:6px}.stat{padding:12px 9px}.stat b{font-size:20px}.grid{gap:7px}.card{padding:6px}.art{height:86px}.hero{padding:19px}.hero h2,.hero p{max-width:85%}.product{gap:9px;padding:11px}.productart{width:58px;height:68px}.buy{padding:9px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

function importNewYearGift(){if(!location.hash.startsWith('#newyeargift='))return;try{const g=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(13)))));location.hash='';if(!g||typeof g.giftId!=='string'||!card(g.cardId)||!Number.isFinite(g.openAt)||g.openAt<Date.now()-86400000)throw new Error('bad gift');state.gifts=state.gifts||[];if(!state.gifts.some(x=>x.giftId===g.giftId))state.gifts.push({...g,sender:'Друг'});save();render();const c=card(g.cardId);modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ТЕБЕ ПОДАРОК</div><div class="bigart" style="--a:#9b3447;--b:#164b3a">🎁</div><h3>Новогодний сюрприз!</h3><p>Подарок уже появился на главной. '+(Date.now()>=g.openAt?'Его можно открыть прямо сейчас.':'Откроется '+new Date(g.openAt).toLocaleString('ru-RU')+'.')+'</p><button class="btn full" id="giftGoHome">К моим подаркам</button>');$('#giftGoHome').onclick=()=>overlay.classList.remove('show')}catch(e){toast('Не удалось принять подарок')}}
function tasks(){ensureDailyQuests();const p=seasonProgress();main.innerHTML='<div class="eyebrow">АКТИВНОСТЬ</div><h1 class="title">Задания</h1><p class="subtitle">Выполняй небольшие цели, получай осколки и продвигайся по коллекции.</p>'+questPanel()+'<div class="section"><h3>Сезонный прогресс</h3><button data-page="season">Открыть сезон →</button></div><div class="wide"><div class="wideicon">🏆</div><div class="widecopy"><b>Сезон '+p.number+': '+p.rank+'</b><small>'+p.count+' из 6 карточек собрано · '+p.daysLeft+' дней осталось</small><div class="progress"><i style="width:'+p.count/6*100+'%"></i></div></div></div><div class="section"><h3>Достижения</h3><span class="tag">'+(achievements().match(/class="achievement done"/g)||[]).length+' / 6</span></div>'+achievements()+'<p class="note">Задания обновляются ежедневно. Награды выдаются один раз за день.</p>'}

function album(){trackQuest('album');let list=cards.filter(c=>(filter==='Все'||c.rarity===filter)&&(!window.albumQuery||c.name.toLowerCase().includes(window.albumQuery.toLowerCase())));main.innerHTML='<h1 class="title">Мой альбом</h1><p class="subtitle">Твоя личная коллекция из '+cards.length+' карточек. Ищи находки и собирай полный набор.</p><input id="albumSearch" class="search" placeholder="⌕  Найти карточку..." value="'+(window.albumQuery||'')+'"><div class="wide"><div class="widecopy"><b>'+unique()+' / '+cards.length+' собрано</b><div class="progress"><i style="width:'+unique()/cards.length*100+'%"></i></div></div><span class="tag">'+Math.round(unique()/cards.length*100)+'%</span></div><div class="tabs">'+['Все','Обычная','Редкая','Эпическая','Легендарная'].map(x=>'<button class="'+(filter===x?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</div><div class="grid">'+list.map(c=>cardView(c,!!state.owned[c.id])).join('')+'</div><p class="note">Пока прогресс сохраняется на этом устройстве. Облачная синхронизация появится после подключения серверного хранилища.</p>'}
function shop(){main.innerHTML='<h1 class="title">Магазин</h1><p class="subtitle">Дополнительные наборы и возможности для твоей коллекции.</p><section class="hero"><div class="eyebrow">МАГАЗИН COLLECT</div><h2>Больше открытий. Больше редкостей.</h2><p>Покупки будут доступны после подключения безопасной онлайн-оплаты.</p></section>'+products.map(p=>'<div class="product"><div class="productart">'+p.emoji+'</div><div class="productinfo"><b>'+p.name+'</b><p>'+p.desc+'</p><span class="price">'+p.price+' ₽</span></div><button class="buy" data-buy="'+p.id+'">Выбрать</button></div>').join('')+'<p class="foot">Все цены указаны в рублях. Оплата пока отключена: нажатие не создаёт заказ и не списывает деньги.</p>'}
function exchange(){const owned=cards.filter(c=>state.owned[c.id]);main.innerHTML='<h1 class="title">Обмен и подарки</h1><p class="subtitle">Используй осколки для новых наборов или делись находками с друзьями.</p><div class="wide"><div class="wideicon">✧</div><div class="widecopy"><b>'+state.fragments+' осколков на балансе</b><small>50 осколков = 1 дополнительный набор. Повторы карточек пополняют баланс.</small></div><button class="buy" data-redeem="1" '+(state.fragments<50?'disabled':'')+'>Обменять</button></div><section class="hero"><div class="eyebrow">КОЛЛЕКЦИОНИРУЙ ВМЕСТЕ</div><h2>Поделись своей находкой</h2><p>Каждая подарочная ссылка открывает выбранную карточку для друга.</p></section><div class="section"><h3>Выбери карточку</h3><span class="tag">'+owned.length+' доступно</span></div><div class="grid">'+(owned.map(c=>'<button class="card" data-gift="'+c.id+'"><div class="art" style="--a:'+c.a+';--b:'+c.b+'">'+c.emoji+'</div><strong>'+c.name+'</strong><small>Подарить другу</small></button>').join('')||'<div class="empty">Пока нет карточек для подарка. Открой бесплатный набор на главной.</div>')+'</div><p class="note">Подарок создаёт копию карточки. Это не серверный обмен: ссылка может быть открыта несколько раз.</p>'}
function profile(){modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ПРОФИЛЬ КОЛЛЕКЦИОНЕРА</div><div class="bigart" style="--a:#51447f;--b:#25223f">'+(plus()?'👑':'☺')+'</div><h3>'+(plus()?'COLLECT PLUS':'Коллекционер')+'</h3><p>Уникальных карточек: '+unique()+' из '+cards.length+'<br>Всего экземпляров: '+total()+'<br>Открыто наборов: '+state.opened+'<br>Осколков: '+state.fragments+'<br>Серия входов: '+(state.streakCount||0)+' дней<br>Статус PLUS: '+(plus()?'активен до '+new Date(state.plusUntil).toLocaleDateString('ru-RU'):'не подключён')+'</p><div class="actions"><button class="btn secondary" id="backup">Экспорт копии</button><button class="btn secondary" id="restore">Импорт копии</button><button class="btn" id="ok">Готово</button></div><input id="backupFile" type="file" accept="application/json,.json" hidden><p class="note">Копия переносит прогресс между устройствами вручную. Профиль пока локальный, без авторизации MAX и облачной синхронизации.</p>');$('#ok').onclick=()=>overlay.classList.remove('show');$('#backup').onclick=()=>{const backup={app:'COLLECT',version:1,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='collect-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия сохранена')};$('#restore').onclick=()=>$('#backupFile').click()}
function redeemFragments(){if(state.fragments<50){toast('Нужно ещё '+(50-state.fragments)+' осколков');return}state.fragments-=50;save();openPack(1,true);toast('Осколки обменяны на набор')}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();if(page==='album')album();if(page==='tasks')tasks();if(page==='shop')shop();if(page==='exchange')exchange();if(page==='season')season()}
$('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
main.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;window.albumQuery='';album();return}const r=e.target.closest('[data-redeem]');if(r){redeemFragments();return}const b=e.target.closest('[data-buy]');if(b){buy(b.dataset.buy);return}const g=e.target.closest('[data-gift]');if(g){giftId=g.dataset.gift;shareGift();return}const c=e.target.closest('[data-card]');if(c){openCard(c.dataset.card);return}if(e.target.closest('#newYearGift')){newYearGift();return}const og=e.target.closest('[data-open-gift]');if(og){openNewYearGift(og.dataset.openGift);return}if(e.target.closest('#freePack')){if(state.lastFree===today()){toast('Бесплатный набор уже получен сегодня');return}openPack(1,false);return}if(e.target.closest('#plusOffer')){buy('premium');return}if(e.target.closest('#seasonClaim')){claimSeasonReward();return}const q=e.target.closest('[data-quest]');if(q){claimQuest(q.dataset.quest)}});
main.addEventListener('input',e=>{if(e.target.id==='albumSearch'){window.albumQuery=e.target.value;const grid=main.querySelector('.grid');if(grid){const list=cards.filter(c=>(filter==='Все'||c.rarity===filter)&&c.name.toLowerCase().includes(window.albumQuery.toLowerCase()));grid.innerHTML=list.map(c=>cardView(c,!!state.owned[c.id])).join('')||'<div class="empty">Ничего не найдено. Попробуй другое название.</div>'}}});
modal.addEventListener('change',async e=>{if(e.target.id!=='backupFile'||!e.target.files||!e.target.files[0])return;try{const raw=JSON.parse(await e.target.files[0].text()),data=raw&&raw.app==='COLLECT'&&raw.version===1?raw.data:raw;if(!data||typeof data!=='object'||Array.isArray(data)||!data.owned||typeof data.owned!=='object'||Array.isArray(data.owned))throw new Error('Формат копии не распознан');const owned={};for(const [id,count] of Object.entries(data.owned)){if(!card(id)||!Number.isInteger(count)||count<0||count>9999)throw new Error('В копии обнаружены некорректные карточки');if(count>0)owned[id]=count}const integer=(v,d=0)=>Number.isInteger(v)&&v>=0?v:d;if(data.fragments!==undefined&&(!Number.isInteger(data.fragments)||data.fragments<0||data.fragments>100000000))throw new Error('Некорректный баланс осколков');if(data.opened!==undefined&&(!Number.isInteger(data.opened)||data.opened<0||data.opened>100000000))throw new Error('Некорректное число открытий');const restored={owned,fragments:integer(data.fragments),lastFree:typeof data.lastFree==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.lastFree)?data.lastFree:'',opened:integer(data.opened),plusUntil:Number.isFinite(data.plusUntil)&&data.plusUntil>0?data.plusUntil:0,seasonClaims:data.seasonClaims&&typeof data.seasonClaims==='object'&&!Array.isArray(data.seasonClaims)?Object.fromEntries(Object.entries(data.seasonClaims).filter(([k,v])=>/^season-\d+$/.test(k)&&v===true)): {},questDate:typeof data.questDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.questDate)?data.questDate:'',questProgress:data.questProgress&&typeof data.questProgress==='object'&&!Array.isArray(data.questProgress)?Object.fromEntries(Object.entries(data.questProgress).filter(([k,v])=>['pack','album','season'].includes(k)&&v===true)): {},questClaims:data.questClaims&&typeof data.questClaims==='object'&&!Array.isArray(data.questClaims)?Object.fromEntries(Object.entries(data.questClaims).filter(([k,v])=>['pack','album','season'].includes(k)&&v===true)): {},streakDate:typeof data.streakDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.streakDate)?data.streakDate:'',streakCount:Number.isInteger(data.streakCount)&&data.streakCount>=0&&data.streakCount<=7?data.streakCount:0};if(!window.confirm('Заменить текущий прогресс данными из резервной копии? Текущий прогресс будет перезаписан.'))return;state=restored;save();overlay.classList.remove('show');render();toast('Прогресс восстановлен из копии')}catch(err){toast(err.message==='Формат копии не распознан'||err.message==='Некорректный баланс осколков'||err.message==='Некорректное число открытий'||err.message==='В копии обнаружены некорректные карточки'?err.message:'Не удалось прочитать файл копии')}});
$('#profileBtn').onclick=profile;
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('show')});
load();applyDailyStreak();render();giftImport();importNewYearGift();if(dailyReward)toast('Ежедневная награда: +'+dailyReward+' осколков');
})();
</script></body></html>
