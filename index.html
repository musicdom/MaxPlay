<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>МОЙ ГАРАЖ — автомобиль под контролем</title>
<style>
:root{--bg:#0d141b;--panel:#151f29;--panel2:#1b2935;--line:rgba(255,255,255,.09);--text:#f4f7fa;--muted:#91a0ad;--blue:#4ca6e8;--cyan:#67d5df;--green:#48c99a;--orange:#ffb65c;--red:#ff6b73;--r:20px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 80% -10%,rgba(40,116,165,.22),transparent 42%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(104px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 18px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#2d88c7,#164c76);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px #12609a40}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:800}.brand strong{display:block;font-size:17px;letter-spacing:.4px}.top-action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;width:42px;height:42px;font-size:18px}.page-title{font-size:27px;font-weight:850;letter-spacing:-1px;margin:10px 0 5px}.subtitle{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 20px}.hero{position:relative;overflow:hidden;border:1px solid #6bb7e533;border-radius:25px;padding:20px;background:linear-gradient(120deg,#18364b,#17232e 70%);min-height:178px;margin-bottom:18px}.hero:after{content:"🚘";position:absolute;right:-5px;bottom:-22px;font-size:116px;opacity:.22;filter:grayscale(1);transform:scaleX(-1)}.hero-label{font-size:10px;letter-spacing:1.6px;color:#8acdf6;font-weight:800}.hero h2{font-size:21px;line-height:1.25;margin:10px 0 7px;max-width:65%}.hero p{font-size:12px;color:#b5c6d2;max-width:60%;line-height:1.5;margin:0}.hero .btn{margin-top:15px;position:relative;z-index:1}.btn{border:0;border-radius:14px;padding:13px 17px;font-size:13px;font-weight:750;background:linear-gradient(135deg,#4da9e8,#2877b5);color:white;box-shadow:0 8px 22px #267bb044}.btn:active{transform:scale(.98)}.btn.secondary{background:var(--panel2);border:1px solid var(--line);box-shadow:none;color:var(--text)}.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--muted)}.btn.danger{background:#49242b;color:#ff9ba0;box-shadow:none}.btn.full{width:100%}.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 12px}.section-head h3{font-size:16px;margin:0}.section-head button{background:none;border:0;color:#73c3f4;font-size:12px;font-weight:700}.car-card,.card{background:linear-gradient(145deg,#1b2935,#141e27);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}.car-card{position:relative;overflow:hidden}.car-top{display:flex;gap:13px;align-items:center}.car-photo{width:68px;height:68px;border-radius:17px;background:linear-gradient(145deg,#2c526d,#1b2c3a);display:grid;place-items:center;font-size:35px;flex-shrink:0}.car-name{font-size:17px;font-weight:800}.car-meta{font-size:11px;color:var(--muted);margin-top:5px}.tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:#25425a;color:#9bd6ff;font-size:10px;font-weight:700;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#0e1821;border-radius:13px;padding:11px 9px}.stat b{display:block;font-size:15px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.muted{color:var(--muted)}.small{font-size:11px}.empty{border:1px dashed #40515f;border-radius:20px;padding:28px 18px;text-align:center;color:var(--muted);margin:12px 0 18px}.empty .emoji{font-size:42px;margin-bottom:10px}.empty h3{color:var(--text);font-size:16px;margin:0 0 7px}.empty p{font-size:12px;line-height:1.5;margin:0 0 16px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(14,22,30,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:10}.nav button{border:0;background:none;color:#8293a1;padding:7px 2px 4px;font-size:10px;font-weight:650}.nav button span{display:block;font-size:20px;margin-bottom:4px}.nav button.active{color:#7bc9f7}.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.list-icon{width:40px;height:40px;border-radius:13px;background:#243c4d;display:grid;place-items:center;font-size:19px;flex-shrink:0}.list-main{flex:1;min-width:0}.list-main b{font-size:13px;display:block}.list-main small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.list-value{font-size:13px;font-weight:800;white-space:nowrap}.pill{font-size:10px;color:#9ed8ff;background:#24445a;padding:5px 8px;border-radius:20px}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin:12px 0}.toolbar .btn{white-space:nowrap;padding:10px 13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;color:#a8b6c1;margin:0 0 7px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#0e1821;color:var(--text);padding:13px;font-size:13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4da9e8}.field textarea{min-height:75px;resize:vertical}.overlay{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:#17232e;border:1px solid var(--line);border-radius:24px 24px 18px 18px;padding:20px 17px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 80px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:18px}.close{border:0;background:#263541;color:white;width:34px;height:34px;border-radius:50%;font-size:18px}.notice{border-radius:14px;padding:12px;background:#193448;color:#a9d9f6;font-size:11px;line-height:1.5;margin:12px 0}.passport{background:linear-gradient(145deg,#18384e,#111d27);border:1px solid #4ca6e844;border-radius:22px;padding:19px;margin:12px 0 16px}.passport h2{font-size:23px;margin:8px 0}.passport .passport-car{font-size:64px;text-align:center;padding:16px}.passport-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.passport-grid div{background:#0b1822aa;border-radius:12px;padding:11px}.passport-grid small{display:block;color:#9aabba;font-size:10px}.passport-grid b{font-size:13px;display:block;margin-top:5px}.footer-note{text-align:center;color:#687987;font-size:10px;line-height:1.5;margin:22px 10px}.hidden{display:none!important}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;background:#e8f5ff;color:#142431;padding:12px 18px;border-radius:30px;font-size:12px;font-weight:750;box-shadow:0 8px 30px #0006;max-width:90%;text-align:center}.reminder{border-left:3px solid var(--orange)}.reminder.overdue{border-color:var(--red)}@media(min-width:520px){.app{padding-top:10px}.overlay{align-items:center}.modal{border-radius:24px}}
</style>
</head>
<body>
<div id="app" class="app">
<header class="top"><div class="brand"><div class="brand-mark">🚘</div><div><small>ТВОЙ АВТОМОБИЛЬ</small><strong>МОЙ ГАРАЖ</strong></div></div><button class="top-action" id="topAdd" aria-label="Добавить автомобиль">＋</button></header>
<main id="main"></main>
</div>
<nav class="nav" id="nav">
<button data-page="garage" class="active"><span>🚘</span>Гараж</button>
<button data-page="service"><span>🛠️</span>Обслуживание</button>
<button data-page="expenses"><span>₽</span>Расходы</button>
<button data-page="profile"><span>☰</span>Ещё</button>
</nav>
<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h3 id="modalTitle">Добавить автомобиль</h3><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></section></div>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
var KEY='myGarage.v1';
var state={cars:[],services:[],expenses:[],page:'garage',selected:null};
var main=document.getElementById('main');
var overlay=document.getElementById('overlay');
var modalBody=document.getElementById('modalBody');
var modalTitle=document.getElementById('modalTitle');
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'{}');state.cars=Array.isArray(d.cars)?d.cars:[];state.services=Array.isArray(d.services)?d.services:[];state.expenses=Array.isArray(d.expenses)?d.expenses:[];state.selected=d.selected||state.cars[0]?.id||null;}catch(e){state.cars=[];state.services=[];state.expenses=[];}}
function save(){localStorage.setItem(KEY,JSON.stringify({cars:state.cars,services:state.services,expenses:state.expenses,selected:state.selected}));}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return (Number(v)||0).toLocaleString('ru-RU')+' ₽';}
function date(v){if(!v)return '—';var d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString('ru-RU');}
function car(){return state.cars.find(function(c){return c.id===state.selected;})||state.cars[0]||null;}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.classList.add('hidden');},2300);}
function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;overlay.classList.add('show');}
function closeModal(){overlay.classList.remove('show');}
function field(label,name,placeholder,value,type,full){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input name="'+name+'" type="'+(type||'text')+'" placeholder="'+(placeholder||'')+'" value="'+esc(value||'')+'"></div>';}
function selectField(label,name,options,full){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><select name="'+name+'">'+options.map(function(o){return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>';}).join('')+'</select></div>';}
function carForm(existing){var c=existing||{};openModal(existing?'Изменить автомобиль':'Добавить автомобиль','<form id="carForm" data-edit="'+esc(c.id||'')+'"><div class="form-grid">'+field('Марка','brand','Например, Honda',c.brand,'text')+field('Модель','model','Например, CR-V',c.model,'text')+field('Год выпуска','year','2020',c.year,'number')+field('Текущий пробег, км','mileage','85000',c.mileage,'number')+field('Госномер (необязательно)','plate','А123АА 77',c.plate,'text')+field('VIN (необязательно)','vin','17 символов',c.vin,'text')+field('Цвет','color','Чёрный',c.color,'text')+field('Объём двигателя','engine','2.0',c.engine,'text')+'</div><div class="notice">Госномер и VIN хранятся только на этом устройстве. Не добавляйте конфиденциальные данные, если не хотите их хранить.</div><button class="btn full" type="submit">Сохранить автомобиль</button></form>');}
function serviceForm(){var c=car();if(!c){toast('Сначала добавьте автомобиль');return;}openModal('Записать обслуживание','<form id="serviceForm"><div class="form-grid">'+selectField('Вид работы','type',[['Масло и фильтры','Замена масла и фильтров'],['Тормоза','Тормозная система'],['Шины','Шины и колёса'],['Подвеска','Подвеска'],['Аккумулятор','Аккумулятор'],['Ремонт двигателя','Ремонт двигателя'],['Ремонт коробки','Ремонт коробки'],['ТО','Плановое ТО'],['Другое','Другое']],true)+field('Дата','date','',new Date().toISOString().slice(0,10),'date')+field('Пробег, км','mileage','Пробег на момент работ',c.mileage,'number')+field('Стоимость, ₽','cost','0','','number')+field('Следующее ТО, км','nextMileage','Например, 95000','','number')+field('Следующая дата','nextDate','', '', 'date')+'<div class="field full"><label>Комментарий</label><textarea name="note" placeholder="Что было сделано, какие запчасти установлены..."></textarea></div></div><button class="btn full" type="submit">Сохранить запись</button></form>');}
function expenseForm(){var c=car();if(!c){toast('Сначала добавьте автомобиль');return;}openModal('Добавить расход','<form id="expenseForm"><div class="form-grid">'+selectField('Категория','category',[['Топливо','Топливо'],['Ремонт','Ремонт'],['Запчасти','Запчасти'],['Мойка','Мойка'],['Страховка','Страховка'],['Штрафы','Штрафы'],['Парковка','Парковка'],['Налог','Налог'],['Другое','Другое']],true)+field('Сумма, ₽','amount','Например, 2500','','number')+field('Дата','date','',new Date().toISOString().slice(0,10),'date')+'<div class="field full"><label>Комментарий</label><input name="note" placeholder="Например, АЗС или название детали"></div></div><button class="btn full" type="submit">Сохранить расход</button></form>');}
function sum(arr,key){return arr.reduce(function(a,x){return a+(Number(x[key])||0);},0);}
function renderGarage(){var c=car();var h='<h1 class="page-title">Твой гараж</h1><p class="subtitle">Вся история автомобиля — в одном месте.</p>';if(!state.cars.length){h+='<div class="hero"><div class="hero-label">ЛИЧНЫЙ АВТОМОБИЛЬНЫЙ ЖУРНАЛ</div><h2>Твоя машина. Твоя история.</h2><p>Записывай обслуживание, расходы и следи за состоянием автомобиля.</p></div><div class="empty"><div class="emoji">🚗</div><h3>Гараж пока пуст</h3><p>Добавь первый автомобиль — и начни вести его историю обслуживания.</p><button class="btn" data-action="add-car">＋ Добавить автомобиль</button></div>';main.innerHTML=h;return;}
var sv=state.services.filter(function(x){return x.carId===c.id;});var ex=state.expenses.filter(function(x){return x.carId===c.id;});var spent=sum(ex,'amount')+sum(sv,'cost');
h+='<div class="hero"><div class="hero-label">ТВОЙ АВТОМОБИЛЬ</div><h2>'+esc(c.brand)+' '+esc(c.model)+'</h2><p>'+esc(c.year||'Год не указан')+' · '+(Number(c.mileage)||0).toLocaleString('ru-RU')+' км</p><button class="btn secondary" data-action="passport">Паспорт автомобиля ↗</button></div>';
h+='<div class="car-card"><div class="car-top"><div class="car-photo">🚙</div><div><div class="car-name">'+esc(c.brand)+' '+esc(c.model)+'</div><div class="car-meta">'+esc(c.year||'—')+' год · '+esc(c.plate||'Номер не указан')+'</div><span class="tag">● Мой автомобиль</span></div></div><div class="stats"><div class="stat"><b>'+Number(c.mileage||0).toLocaleString('ru-RU')+'</b><span>Пробег, км</span></div><div class="stat"><b>'+sv.length+'</b><span>Записей ТО</span></div><div class="stat"><b>'+money(spent)+'</b><span>Всего учтено</span></div></div><div class="toolbar"><button class="btn secondary" data-action="edit-car">Изменить</button><button class="btn ghost" data-action="switch-car">Другой авто</button><button class="btn ghost" data-action="delete-car">Удалить</button></div></div>';
h+='<div class="section-head"><h3>Ближайшие напоминания</h3><button data-page="service">Все записи →</button></div>';
var due=sv.filter(function(x){return x.nextDate||x.nextMileage;}).sort(function(a,b){return (a.nextDate||'9999').localeCompare(b.nextDate||'9999');}).slice(0,3);
if(!due.length)h+='<div class="card small muted">Пока нет напоминаний. Добавь запись об обслуживании и укажи следующее ТО.</div>';else due.forEach(function(x){h+='<div class="card reminder"><div class="list-item"><div class="list-icon">⏰</div><div class="list-main"><b>'+esc(x.type)+'</b><small>Следующее ТО: '+(x.nextDate?date(x.nextDate):'дата не указана')+(x.nextMileage?' · '+Number(x.nextMileage).toLocaleString('ru-RU')+' км':'')+'</small></div></div></div>';});
h+='<div class="row"><button class="btn full" data-action="add-service">＋ Обслуживание</button><button class="btn secondary full" data-action="add-expense">＋ Расход</button></div>';
main.innerHTML=h;}
function renderService(){var c=car();var h='<h1 class="page-title">Обслуживание</h1><p class="subtitle">Фиксируй каждую замену, диагностику и ремонт.</p>';if(!c){h+='<div class="empty"><div class="emoji">🛠️</div><h3>Сначала добавь автомобиль</h3><button class="btn" data-action="add-car">Добавить автомобиль</button></div>';main.innerHTML=h;return;}var arr=state.services.filter(function(x){return x.carId===c.id;}).sort(function(a,b){return b.date.localeCompare(a.date);});h+='<div class="card"><div class="row"><div><div class="small muted">Автомобиль</div><b>'+esc(c.brand)+' '+esc(c.model)+'</b></div><span class="pill">'+arr.length+' записей</span></div></div><button class="btn full" data-action="add-service">＋ Добавить обслуживание</button><div class="section-head"><h3>История работ</h3></div>';if(!arr.length)h+='<div class="empty"><div class="emoji">🔧</div><h3>История пока пустая</h3><p>Добавь первую запись, чтобы ничего не забыть.</p></div>';arr.forEach(function(x){h+='<div class="card"><div class="list-item"><div class="list-icon">🛠️</div><div class="list-main"><b>'+esc(x.type)+'</b><small>'+date(x.date)+' · '+Number(x.mileage||0).toLocaleString('ru-RU')+' км</small></div><div class="list-value">'+money(x.cost)+'</div></div>'+(x.note?'<p class="small muted">'+esc(x.note)+'</p>':'')+(x.nextDate||x.nextMileage?'<div class="notice">Следующее ТО: '+(x.nextDate?date(x.nextDate):'')+(x.nextMileage?' · '+Number(x.nextMileage).toLocaleString('ru-RU')+' км':'')+'</div>':'')+'<button class="btn ghost" data-action="delete-service" data-id="'+x.id+'">Удалить запись</button></div>';});main.innerHTML=h;}
function renderExpenses(){var c=car();var h='<h1 class="page-title">Расходы</h1><p class="subtitle">Сколько на самом деле стоит содержать автомобиль.</p>';if(!c){h+='<div class="empty"><div class="emoji">₽</div><h3>Сначала добавь автомобиль</h3><button class="btn" data-action="add-car">Добавить автомобиль</button></div>';main.innerHTML=h;return;}var arr=state.expenses.filter(function(x){return x.carId===c.id;}).sort(function(a,b){return b.date.localeCompare(a.date);});var total=sum(arr,'amount')+sum(state.services.filter(function(x){return x.carId===c.id;}),'cost');h+='<div class="card"><div class="small muted">Учтено расходов и обслуживания</div><div style="font-size:29px;font-weight:850;margin:8px 0">'+money(total)+'</div><div class="small muted">'+arr.length+' отдельных расходов · '+state.services.filter(function(x){return x.carId===c.id;}).length+' записей обслуживания</div></div><button class="btn full" data-action="add-expense">＋ Добавить расход</button><div class="section-head"><h3>История расходов</h3></div>';if(!arr.length)h+='<div class="empty"><div class="emoji">🧾</div><h3>Расходов пока нет</h3><p>Записывай заправки, мойки, страховку и покупки запчастей.</p></div>';arr.forEach(function(x){h+='<div class="card"><div class="list-item"><div class="list-icon">₽</div><div class="list-main"><b>'+esc(x.category)+'</b><small>'+date(x.date)+(x.note?' · '+esc(x.note):'')+'</small></div><div class="list-value">'+money(x.amount)+'</div></div><button class="btn ghost" data-action="delete-expense" data-id="'+x.id+'">Удалить</button></div>';});main.innerHTML=h;}
function renderProfile(){var c=car();var h='<h1 class="page-title">Ещё</h1><p class="subtitle">Настройки и управление данными гаража.</p><div class="card"><div class="list-item"><div class="list-icon">🚘</div><div class="list-main"><b>Мои автомобили</b><small>'+state.cars.length+' в гараже</small></div><button class="btn secondary" data-action="switch-car">Открыть</button></div><div class="list-item"><div class="list-icon">📤</div><div class="list-main"><b>Резервная копия</b><small>Сохранить данные в файл</small></div><button class="btn secondary" data-action="export">Экспорт</button></div><div class="list-item"><div class="list-icon">📥</div><div class="list-main"><b>Восстановить данные</b><small>Загрузить резервную копию</small></div><button class="btn secondary" data-action="import">Импорт</button></div></div><div class="notice">Сейчас данные хранятся локально в браузере этого устройства. Очистка данных браузера может удалить записи. Регулярно делай резервную копию.</div><div class="footer-note">МОЙ ГАРАЖ · Первая версия<br>История обслуживания заполняется владельцем и не является официальной проверкой автомобиля.</div>';main.innerHTML=h;}
function render(){document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===state.page);});if(state.page==='garage')renderGarage();else if(state.page==='service')renderService();else if(state.page==='expenses')renderExpenses();else renderProfile();}
function passportData(c){return {brand:c.brand,model:c.model,year:c.year,mileage:c.mileage,plate:c.plate,color:c.color,engine:c.engine,services:state.services.filter(function(x){return x.carId===c.id;}).map(function(x){return {type:x.type,date:x.date,mileage:x.mileage,note:x.note,nextDate:x.nextDate,nextMileage:x.nextMileage};}).sort(function(a,b){return b.date.localeCompare(a.date);}),created:new Date().toISOString().slice(0,10)};}
function encode(obj){var s=JSON.stringify(obj);return btoa(unescape(encodeURIComponent(s)));}
function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s))));}
function showPassport(data,publicMode){var h='<div class="passport"><div class="hero-label">ПАСПОРТ АВТОМОБИЛЯ</div><div class="passport-car">🚘</div><h2>'+esc(data.brand)+' '+esc(data.model)+'</h2><p class="small muted">'+esc(data.year||'')+' год выпуска</p><div class="passport-grid"><div><small>Пробег</small><b>'+Number(data.mileage||0).toLocaleString('ru-RU')+' км</b></div><div><small>Госномер</small><b>'+esc(data.plate||'Не указан')+'</b></div><div><small>Цвет</small><b>'+esc(data.color||'—')+'</b></div><div><small>Двигатель</small><b>'+esc(data.engine||'—')+'</b></div></div></div><div class="section-head"><h3>История обслуживания</h3><span class="pill">'+(data.services||[]).length+' записей</span></div>';if(!(data.services||[]).length)h+='<div class="card small muted">Владелец пока не добавил записи об обслуживании.</div>';(data.services||[]).forEach(function(x){h+='<div class="card"><div class="list-item"><div class="list-icon">🔧</div><div class="list-main"><b>'+esc(x.type)+'</b><small>'+date(x.date)+' · '+Number(x.mileage||0).toLocaleString('ru-RU')+' км</small></div></div>'+(x.note?'<p class="small muted">'+esc(x.note)+'</p>':'')+'</div>';});h+='<div class="notice">Это информация, внесённая владельцем. Она не подтверждена сервисными центрами и не заменяет официальную проверку истории автомобиля.</div>';if(!publicMode)h+='<button class="btn full" data-action="share-passport">Поделиться паспортом ↗</button><button class="btn secondary full" style="margin-top:9px" data-action="back">Вернуться в гараж</button>';else h+='<button class="btn full" data-action="back-home">Создать свой гараж</button>';main.innerHTML='<h1 class="page-title">'+(publicMode?'Паспорт автомобиля':'Паспорт')+'</h1><p class="subtitle">'+(publicMode?'История, которой поделился владелец автомобиля.':'Поделись историей своего автомобиля с покупателем.')+'</p>'+h;}
function sharePassport(){var c=car();if(!c)return;var url=location.origin+location.pathname+'#passport='+encodeURIComponent(encode(passportData(c)));if(url.length>7000){toast('Слишком много записей для ссылки. Попробуй позже.');return;}if(navigator.share){navigator.share({title:'Паспорт автомобиля — '+c.brand+' '+c.model,text:'История обслуживания автомобиля',url:url}).catch(function(){});}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast('Ссылка скопирована');}).catch(function(){prompt('Скопируй ссылку:',url);});}else prompt('Скопируй ссылку:',url);}
function exportData(){var blob=new Blob([JSON.stringify({cars:state.cars,services:state.services,expenses:state.expenses,selected:state.selected},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moj-garazh-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена');}
function importData(file){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.cars)||!Array.isArray(d.services)||!Array.isArray(d.expenses))throw Error();state.cars=d.cars;state.services=d.services;state.expenses=d.expenses;state.selected=d.selected||state.cars[0]?.id||null;save();state.page='garage';render();toast('Данные восстановлены');}catch(e){toast('Не удалось прочитать файл');}};r.readAsText(file);}
document.addEventListener('click',function(e){var nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();return;}var b=e.target.closest('[data-action]');if(!b)return;var a=b.dataset.action;if(a==='add-car')carForm();else if(a==='edit-car'){var c=car();if(c)carForm(c);}else if(a==='add-service')serviceForm();else if(a==='add-expense')expenseForm();else if(a==='passport'){var c=car();if(c)showPassport(passportData(c),false);}else if(a==='share-passport')sharePassport();else if(a==='back'){state.page='garage';render();}else if(a==='back-home'){history.replaceState(null,'',location.pathname);state.page='garage';render();}else if(a==='switch-car'){if(!state.cars.length){carForm();return;}openModal('Выбрать автомобиль','<div>'+state.cars.map(function(c){return '<button class="btn secondary full" style="margin-bottom:8px;text-align:left" data-action="select-car" data-id="'+c.id+'">'+esc(c.brand)+' '+esc(c.model)+' · '+esc(c.year||'')+'</button>';}).join('')+'<button class="btn full" data-action="add-car">＋ Добавить автомобиль</button></div>');}else if(a==='select-car'){state.selected=b.dataset.id;save();closeModal();state.page='garage';render();}else if(a==='delete-car'){var c=car();if(c&&confirm('Удалить автомобиль и все его записи?')){state.cars=state.cars.filter(function(x){return x.id!==c.id;});state.services=state.services.filter(function(x){return x.carId!==c.id;});state.expenses=state.expenses.filter(function(x){return x.carId!==c.id;});state.selected=state.cars[0]?.id||null;save();render();toast('Автомобиль удалён');}}else if(a==='delete-service'){if(confirm('Удалить эту запись?')){state.services=state.services.filter(function(x){return x.id!==b.dataset.id;});save();renderService();}}else if(a==='delete-expense'){if(confirm('Удалить этот расход?')){state.expenses=state.expenses.filter(function(x){return x.id!==b.dataset.id;});save();renderExpenses();}}else if(a==='export')exportData();else if(a==='import'){var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=function(){if(inp.files[0])importData(inp.files[0]);};inp.click();}});
document.getElementById('topAdd').addEventListener('click',function(){carForm();});
document.getElementById('closeModal').addEventListener('click',closeModal);
overlay.addEventListener('click',function(e){if(e.target===overlay)closeModal();});
document.addEventListener('submit',function(e){e.preventDefault();var f=e.target;if(f.id==='carForm'){var d=new FormData(f);var c={id:car()&&f.dataset.edit?f.dataset.edit:id(),brand:d.get('brand').trim(),model:d.get('model').trim(),year:d.get('year'),mileage:d.get('mileage'),plate:d.get('plate').trim(),vin:d.get('vin').trim(),color:d.get('color').trim(),engine:d.get('engine').trim()};if(!c.brand||!c.model){toast('Укажи марку и модель');return;}var old=state.cars.find(function(x){return x.id===c.id;});if(old)Object.assign(old,c);else{state.cars.push(c);state.selected=c.id;}save();closeModal();state.page='garage';render();toast('Автомобиль сохранён');}else if(f.id==='serviceForm'){var d=new FormData(f),c=car();state.services.push({id:id(),carId:c.id,type:d.get('type'),date:d.get('date'),mileage:d.get('mileage'),cost:d.get('cost'),nextMileage:d.get('nextMileage'),nextDate:d.get('nextDate'),note:d.get('note')});if(Number(d.get('mileage'))>Number(c.mileage))c.mileage=d.get('mileage');save();closeModal();state.page='service';render();toast('Запись добавлена');}else if(f.id==='expenseForm'){var d=new FormData(f),c=car();state.expenses.push({id:id(),carId:c.id,category:d.get('category'),amount:d.get('amount'),date:d.get('date'),note:d.get('note')});save();closeModal();state.page='expenses';render();toast('Расход сохранён');}});
function init(){load();var hash=location.hash;if(hash.indexOf('#passport=')===0){try{var data=decode(decodeURIComponent(hash.slice(10)));document.getElementById('nav').classList.add('hidden');document.getElementById('topAdd').classList.add('hidden');showPassport(data,true);return;}catch(e){history.replaceState(null,'',location.pathname);}}render();}
init();
})();
</script>
</body>
</html>
