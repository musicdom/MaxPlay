<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAX Выгода</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --bg-primary:#0a0a0f; --glass-bg:rgba(255,255,255,0.04); --glass-border:rgba(255,255,255,0.06);
            --text-primary:#fff; --text-secondary:#9898a0; --text-tertiary:#6b6b75;
            --accent:#4f8fff; --accent-secondary:#7c5cfc; --success:#2ecc71;
            --border-radius-sm:12px; --border-radius-lg:24px; --border-radius-xl:28px;
            --transition-fast:0.15s ease;
        }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); overflow-x:hidden; min-height:100vh; }
        #app { min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .app-container { width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; background:var(--bg-primary); overflow:hidden; }
        .main-content { flex:1; overflow-y:auto; padding:20px; }
        .bottom-nav { height:80px; background:rgba(18,18,26,0.85); backdrop-filter:blur(30px); border-top:1px solid var(--glass-border); display:flex; align-items:center; justify-content:space-around; padding:0 10px; z-index:100; }
        .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 12px; border-radius:16px; cursor:pointer; color:var(--text-tertiary); background:none; border:none; font-family:inherit; }
        .nav-item.active { color:var(--accent); }
        .nav-item.active::before { content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:24px; height:3px; background:var(--accent); border-radius:0 0 3px 3px; box-shadow:0 0 12px rgba(79,143,255,0.3); }
        .nav-icon { font-size:22px; }
        .nav-label { font-size:11px; }
        .promotions-header { margin-bottom:16px; }
        .promotions-page-title { font-size:28px; font-weight:800; background:linear-gradient(135deg,#fff,#c0c0d0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .promotions-page-subtitle { font-size:14px; color:var(--text-tertiary); }
        .search-wrapper { margin-bottom:14px; }
        .search-container { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); border:1px solid var(--glass-border); border-radius:var(--border-radius-lg); padding:4px; display:flex; align-items:center; }
        .search-icon { font-size:20px; padding:12px 8px 12px 14px; color:var(--text-tertiary); }
        .search-input { flex:1; background:transparent; border:none; color:var(--text-primary); font-size:16px; padding:12px 8px; outline:none; }
        .search-input::placeholder { color:var(--text-tertiary); }
        .search-clear { background:rgba(255,255,255,0.08); border:none; color:var(--text-secondary); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-right:6px; font-size:14px; }
        .promo-filters-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; }
        .promo-filter-chip { flex-shrink:0; background:var(--glass-bg); backdrop-filter:blur(10px); border:1px solid var(--glass-border); border-radius:28px; padding:8px 14px; display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12px; color:var(--text-secondary); transition:var(--transition-fast); }
        .promo-filter-chip.active { background:rgba(79,143,255,0.15); border-color:rgba(79,143,255,0.3); color:#fff; }
        .filter-chip-emoji { font-size:14px; }
        .promo-sort-container { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
        .sort-label { font-size:12px; color:var(--text-tertiary); }
        .sort-buttons { display:flex; gap:6px; }
        .sort-btn { background:var(--glass-bg); backdrop-filter:blur(10px); border:1px solid var(--glass-border); border-radius:20px; padding:6px 14px; cursor:pointer; font-size:12px; color:var(--text-secondary); transition:var(--transition-fast); }
        .sort-btn.active { background:rgba(124,92,252,0.15); border-color:rgba(124,92,252,0.3); color:#7c5cfc; }
        .promo-grid { display:flex; flex-direction:column; gap:12px; }
        .promo-card { background:rgba(255,255,255,0.03); backdrop-filter:blur(15px); border:1px solid var(--glass-border); border-radius:var(--border-radius-lg); padding:16px; position:relative; animation:fadeSlideIn 0.4s ease forwards; }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(20px) scale(0.96);} to{opacity:1;transform:translateY(0) scale(1);} }
        .promo-card-logo-container { width:48px; height:48px; border-radius:12px; overflow:hidden; margin-bottom:10px; background:rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; }
        .promo-card-logo { width:100%; height:100%; object-fit:contain; }
        .promo-card-logo-fallback { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:var(--accent); background:rgba(79,143,255,0.3); }
        .promo-favorite-btn { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,0.4); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
        .promo-card-new-badge { position:absolute; top:12px; left:12px; background:linear-gradient(135deg,#ff6b6b,#ee5a24); color:#fff; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; }
        .promo-card-vip-badge { position:absolute; top:50px; left:12px; background:linear-gradient(135deg,#ffd700,#ffaa00); color:#000; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; }
        .promo-card-info { margin:8px 0; }
        .promo-card-store { font-size:16px; font-weight:700; }
        .promo-card-discount { font-size:22px; font-weight:800; background:linear-gradient(135deg,var(--success),#7bed9f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .promo-card-description { font-size:14px; color:var(--text-secondary); }
        .promo-card-date { font-size:12px; color:var(--text-tertiary); }
        .promo-card-stats { display:flex; gap:12px; font-size:11px; color:var(--text-tertiary); margin:4px 0; }
        .promo-card-button { width:100%; background:linear-gradient(135deg,rgba(79,143,255,0.2),rgba(124,92,252,0.2)); border:1px solid rgba(79,143,255,0.3); color:#fff; padding:12px; border-radius:12px; font-weight:600; cursor:pointer; font-family:inherit; }
        .offline-card { text-align:center; padding:32px; }
        .offline-icon { font-size:48px; }
        .toast-container { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999; width:calc(100% - 40px); max-width:440px; }
        .toast { background:rgba(30,30,40,0.9); backdrop-filter:blur(30px); border:1px solid var(--glass-border); border-radius:16px; padding:14px; color:#fff; text-align:center; animation:toastIn 0.3s ease; }
        @keyframes toastIn { from{opacity:0;transform:translateY(-20px) scale(0.9);} to{opacity:1;transform:translateY(0) scale(1);} }
        .vip-card { border:2px solid transparent; background-clip:padding-box; position:relative; }
        .vip-card::before { content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px; background:linear-gradient(135deg,#ffd700,#ffaa00); border-radius:24px; z-index:-1; animation:vipGlow 3s ease-in-out infinite; background-size:300% 300%; }
        @keyframes vipGlow { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <main id="main-content" class="main-content"></main>
            <nav id="bottom-nav" class="bottom-nav"></nav>
        </div>
    </div>

    <script>
        // ⚙️ НАСТРОЙКИ (ВАШИ ДАННЫЕ)
        var CONFIG = {
            GOOGLE_SHEET_ID: '1Wtv4kA1W_hb4bvjyc7ruecrVw5s4Gh-TBQR1PRJYo2c',
            API_KEY: 'AIzaSyAbTbin2-mkFRspURGKRXxyCpjy_Dez8ts',
            SHEET_NAME: 'Акции',
            CACHE_KEY: 'maxvygoda_offers_cache',
            CACHE_TIMESTAMP_KEY: 'maxvygoda_cache_timestamp',
            FAVORITES_KEY: 'maxvygoda_favorites',
            STATS_KEY: 'maxvygoda_stats',
            CACHE_DURATION: 300000,
            AUTO_REFRESH_INTERVAL: 300000,
            DEBOUNCE_DELAY: 250,
            COLUMNS: { ID:0, STORE:1, CATEGORY:2, DISCOUNT:3, DESCRIPTION:4, LINK:5, LOGO:6, VIP:7, ACTIVE:8, DATE:9 }
        };

        // Cache
        var Cache = {
            save: function(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {} },
            load: function(key) { try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; } },
            isExpired: function() { var t = this.load(CONFIG.CACHE_TIMESTAMP_KEY); return !t || (Date.now() - t) > CONFIG.CACHE_DURATION; },
            updateTimestamp: function() { this.save(CONFIG.CACHE_TIMESTAMP_KEY, Date.now()); },
            getCachedOffers: function() { if (this.isExpired()) return null; return this.load(CONFIG.CACHE_KEY); },
            saveOffers: function(offers) { this.save(CONFIG.CACHE_KEY, offers); this.updateTimestamp(); }
        };

        // Stats
        var Stats = {
            getStats: function() { return Cache.load(CONFIG.STATS_KEY) || {}; },
            saveStats: function(s) { Cache.save(CONFIG.STATS_KEY, s); },
            recordView: function(id) {
                var s = this.getStats();
                if (!s[id]) s[id] = { views:0, clicks:0, favorites:0 };
                s[id].views++;
                this.saveStats(s);
            },
            recordClick: function(id) {
                var s = this.getStats();
                if (!s[id]) s[id] = { views:0, clicks:0, favorites:0 };
                s[id].clicks++;
                this.saveStats(s);
            },
            recordFavorite: function(id, added) {
                var s = this.getStats();
                if (!s[id]) s[id] = { views:0, clicks:0, favorites:0 };
                added ? s[id].favorites++ : s[id].favorites = Math.max(0, s[id].favorites - 1);
                this.saveStats(s);
            },
            getOfferStats: function(id) { var s = this.getStats(); return s[id] || { views:0, clicks:0, favorites:0 }; }
        };

        // Favorites
        var Favorites = {
            get: function() { return Cache.load(CONFIG.FAVORITES_KEY) || []; },
            save: function(f) { Cache.save(CONFIG.FAVORITES_KEY, f); },
            isFav: function(id) { return this.get().indexOf(id) > -1; },
            toggle: function(id) {
                var f = this.get();
                var idx = f.indexOf(id);
                var added = false;
                if (idx > -1) { f.splice(idx, 1); } else { f.push(id); added = true; }
                this.save(f);
                Stats.recordFavorite(id, added);
                return added;
            }
        };

        // API
        var API = {
            offers: [],
            categories: [],
            isLoading: false,
            fetchSheet: function() {
                var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.GOOGLE_SHEET_ID + '/values/' + CONFIG.SHEET_NAME + '?key=' + CONFIG.API_KEY;
                return fetch(url).then(function(r) { if (!r.ok) throw new Error('Ошибка сети'); return r.json(); });
            },
            parseRow: function(row, i) {
                var c = CONFIG.COLUMNS;
                return {
                    id: row[c.ID] ? parseInt(row[c.ID]) : i+1,
                    store: row[c.STORE] || '', category: row[c.CATEGORY] || 'other',
                    discount: row[c.DISCOUNT] || '', description: row[c.DESCRIPTION] || '',
                    link: row[c.LINK] || '#', logo: row[c.LOGO] || '',
                    isVip: row[c.VIP] && row[c.VIP].toLowerCase() === 'да',
                    isActive: row[c.ACTIVE] ? row[c.ACTIVE].toLowerCase() === 'да' : true,
                    date: row[c.DATE] || ''
                };
            },
            parseData: function(data) {
                if (!data || !data.values || data.values.length < 2) return [];
                var rows = data.values.slice(1);
                var self = this;
                return rows.map(function(r,i) { return self.parseRow(r,i); }).filter(function(o) { return o.isActive && o.store; });
            },
            extractCategories: function(offers) {
                var cats = [{ id:'all', name:'Все', emoji:'🔥' }];
                var meta = {
                    'еда': { emoji:'🍕' }, 'маркетплейсы': { emoji:'📦' }, 'банки': { emoji:'💳' },
                    'связь': { emoji:'📱' }, 'игры': { emoji:'🎮' }, 'путешествия': { emoji:'✈️' },
                    'магазины': { emoji:'🏪' }, 'авто': { emoji:'🚗' }
                };
                var set = {};
                offers.forEach(function(o) {
                    var key = o.category.toLowerCase().trim();
                    if (key && !set[key]) {
                        set[key] = true;
                        var m = meta[key] || { emoji:'📌', name: o.category };
                        cats.push({ id: key, name: m.name || o.category, emoji: m.emoji });
                    }
                });
                return cats;
            },
            loadOffers: function(force) {
                if (this.isLoading) return Promise.resolve(this.offers);
                if (!force && !Cache.isExpired()) {
                    var cached = Cache.getCachedOffers();
                    if (cached && cached.length) {
                        this.offers = cached;
                        this.categories = this.extractCategories(cached);
                        return Promise.resolve(cached);
                    }
                }
                this.isLoading = true;
                var self = this;
                return this.fetchSheet().then(function(data) {
                    var offers = self.parseData(data);
                    if (offers.length) {
                        self.offers = offers;
                        self.categories = self.extractCategories(offers);
                        Cache.saveOffers(offers);
                    } else {
                        var cached = Cache.getCachedOffers();
                        self.offers = cached || [];
                        self.categories = self.extractCategories(self.offers);
                    }
                    self.isLoading = false;
                    return self.offers;
                }).catch(function(e) {
                    console.error(e);
                    var cached = Cache.getCachedOffers();
                    self.offers = cached || [];
                    self.categories = self.extractCategories(self.offers);
                    self.isLoading = false;
                    return self.offers;
                });
            },
            getOffers: function(cat, sort, query) {
                var filtered = this.offers.slice();
                if (cat && cat !== 'all') filtered = filtered.filter(function(o) { return o.category.toLowerCase() === cat; });
                if (query) {
                    var q = query.toLowerCase();
                    filtered = filtered.filter(function(o) {
                        return o.store.toLowerCase().indexOf(q) > -1 ||
                               o.description.toLowerCase().indexOf(q) > -1 ||
                               o.category.toLowerCase().indexOf(q) > -1;
                    });
                }
                if (sort === 'popular') filtered.sort(function(a,b) { return (b.popularity||0) - (a.popularity||0); });
                else if (sort === 'discount') filtered.sort(function(a,b) { return (parseInt(b.discount)||0) - (parseInt(a.discount)||0); });
                else filtered.sort(function(a,b) { return b.id - a.id; });
                return filtered;
            }
        };

        // Cards
        var Cards = {
            createCard: function(offer, index) {
                var card = document.createElement('div');
                card.className = 'promo-card';
                if (offer.isVip) card.classList.add('vip-card');
                Stats.recordView(offer.id);

                var logoCont = document.createElement('div'); logoCont.className = 'promo-card-logo-container';
                var img = document.createElement('img'); img.className = 'promo-card-logo';
                img.src = offer.logo || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22%3E%3Crect fill=%22%23333%22 width=%2248%22 height=%2248%22/%3E%3Ctext fill=%22%23fff%22 x=%2224%22 y=%2232%22 text-anchor=%22middle%22 font-size=%2220%22%3E' + offer.store.charAt(0) + '%3C/text%3E%3C/svg%3E';
                img.alt = offer.store;
                logoCont.appendChild(img);

                var favBtn = document.createElement('button'); favBtn.className = 'promo-favorite-btn';
                favBtn.innerHTML = Favorites.isFav(offer.id) ? '❤️' : '🤍';
                favBtn.onclick = function(e) { e.stopPropagation(); var added = Favorites.toggle(offer.id); favBtn.innerHTML = added ? '❤️' : '🤍'; };

                var newBadge = document.createElement('div'); newBadge.className = 'promo-card-new-badge'; newBadge.textContent = 'NEW';
                var vipBadge = document.createElement('div'); vipBadge.className = 'promo-card-vip-badge'; vipBadge.textContent = '⭐ VIP';
                if (!offer.isVip) vipBadge.style.display = 'none';

                var info = document.createElement('div'); info.className = 'promo-card-info';
                info.innerHTML = '<div class="promo-card-store">'+offer.store+'</div>' +
                                 '<div class="promo-card-discount">'+offer.discount+'</div>' +
                                 '<div class="promo-card-description">'+offer.description+'</div>' +
                                 '<div class="promo-card-date">⏳ до '+offer.date+'</div>' +
                                 '<div class="promo-card-stats">👁 '+Stats.getOfferStats(offer.id).views+' 🔗 '+Stats.getOfferStats(offer.id).clicks+'</div>';

                var btn = document.createElement('button'); btn.className = 'promo-card-button'; btn.textContent = 'Получить скидку';
                btn.onclick = function(e) { e.stopPropagation(); Stats.recordClick(offer.id); window.open(offer.link, '_blank'); };

                card.appendChild(logoCont); card.appendChild(favBtn); card.appendChild(newBadge); card.appendChild(vipBadge);
                card.appendChild(info); card.appendChild(btn);
                return card;
            },
            renderGrid: function(container, offers) {
                container.innerHTML = '';
                if (!offers.length) {
                    container.innerHTML = '<div class="promo-card offline-card"><div class="offline-icon">🔍</div><div>Ничего не найдено</div></div>';
                    return;
                }
                var grid = document.createElement('div'); grid.className = 'promo-grid';
                offers.forEach(function(o,i) { grid.appendChild(Cards.createCard(o,i)); });
                container.appendChild(grid);
            }
        };

        // App
        var App = {
            cat: 'all', sort: 'new', query: '',
            init: function() {
                this.content = document.getElementById('main-content');
                this.nav = document.getElementById('bottom-nav');
                this.renderUI();
                var self = this;
                API.loadOffers().then(function() {
                    self.updateFilters();
                    self.renderContent();
                });
            },
            renderUI: function() {
                this.content.innerHTML = '<div class="promotions-header"><div class="promotions-page-title">🎯 MAX Выгода</div><div class="promotions-page-subtitle">Лучшие предложения</div></div>' +
                    '<div class="search-wrapper"><div class="search-container"><span class="search-icon">🔍</span><input class="search-input" placeholder="Поиск акций..." id="searchInput"><button class="search-clear" id="clearSearch" style="display:none">✕</button></div></div>' +
                    '<div class="promo-filters-scroll" id="filtersScroll"></div>' +
                    '<div class="promo-sort-container"><span class="sort-label">Сортировка:</span><div class="sort-buttons" id="sortButtons"></div></div>' +
                    '<div id="promoContent" class="promo-grid">Загрузка...</div>';
                this.renderNav();
                this.setupListeners();
            },
            renderNav: function() {
                this.nav.innerHTML = '';
                var items = [{ id:'home', icon:'🏠', label:'Главная' },{ id:'promotions', icon:'🎯', label:'Акции' },{ id:'favorites', icon:'❤️', label:'Избранное' }];
                var self = this;
                items.forEach(function(item) {
                    var el = document.createElement('button'); el.className = 'nav-item';
                    if (item.id === 'promotions') el.classList.add('active');
                    el.innerHTML = '<span class="nav-icon">'+item.icon+'</span><span class="nav-label">'+item.label+'</span>';
                    el.onclick = function() { self.renderUI(); };
                    self.nav.appendChild(el);
                });
            },
            setupListeners: function() {
                var self = this;
                var search = document.getElementById('searchInput');
                var clear = document.getElementById('clearSearch');
                search.oninput = function() {
                    clear.style.display = search.value ? 'flex' : 'none';
                    self.query = search.value;
                    self.renderContent();
                };
                clear.onclick = function() { search.value = ''; clear.style.display = 'none'; self.query = ''; self.renderContent(); };
            },
            updateFilters: function() {
                var container = document.getElementById('filtersScroll');
                container.innerHTML = '';
                var cats = API.categories;
                var self = this;
                cats.forEach(function(cat) {
                    var chip = document.createElement('button'); chip.className = 'promo-filter-chip';
                    if (cat.id === self.cat) chip.classList.add('active');
                    chip.innerHTML = '<span class="filter-chip-emoji">'+cat.emoji+'</span><span class="filter-chip-name">'+cat.name+'</span>';
                    chip.onclick = function() {
                        self.cat = cat.id;
                        self.updateFilters();
                        self.renderContent();
                    };
                    container.appendChild(chip);
                });
                var sortContainer = document.getElementById('sortButtons');
                sortContainer.innerHTML = '';
                var sorts = [{ id:'new', name:'Новые' },{ id:'popular', name:'Популярные' },{ id:'discount', name:'Макс. скидка' }];
                sorts.forEach(function(s) {
                    var btn = document.createElement('button'); btn.className = 'sort-btn';
                    if (s.id === self.sort) btn.classList.add('active');
                    btn.textContent = s.name;
                    btn.onclick = function() {
                        self.sort = s.id;
                        self.updateFilters();
                        self.renderContent();
                    };
                    sortContainer.appendChild(btn);
                });
            },
            renderContent: function() {
                var offers = API.getOffers(this.cat, this.sort, this.query);
                Cards.renderGrid(document.getElementById('promoContent'), offers);
            }
        };

        document.addEventListener('DOMContentLoaded', function() { App.init(); });
    </script>
</body>
</html>
