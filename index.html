<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e18"><title>COLLECT — твоя коллекция</title>
<style>
:root{color-scheme:dark;--bg:#0b0e18;--surface:#141a29;--surface2:#1b2335;--line:#ffffff12;--text:#f5f7ff;--muted:#8994ad;--purple:#9277ff;--cyan:#67d7df;--gold:#f2c66d;--pink:#ed8fbd;--green:#73d6aa}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% -20%,#49377b55,transparent 45%),var(--bg);min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(94px + env(safe-area-inset-bottom))}.top{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#b6a4ff,#6548cf);display:grid;place-items:center;font-size:21px;box-shadow:0 7px 22px #7958d955}.brand strong{font-size:15px;letter-spacing:1.3px}.brand small{display:block;color:#a99aff;font-size:8px;letter-spacing:2px;font-weight:900;margin-top:3px}.avatar{width:39px;height:39px;border:1px solid var(--line);border-radius:50%;background:var(--surface2);font-size:18px}.title{font-size:27px;letter-spacing:-1.1px;font-weight:850;margin:13px 0 5px}.subtitle{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 18px}.hero{position:relative;overflow:hidden;border-radius:23px;border:1px solid #a58dff40;padding:20px;background:linear-gradient(125deg,#382d60,#1a2032 70%);margin:16px 0}.hero:after{content:"✦";position:absolute;right:5px;top:-30px;font-size:155px;color:#d6ccff17;pointer-events:none}.eyebrow{font-size:9px;font-weight:900;letter-spacing:1.7px;color:#c5baff}.hero h2{font-size:22px;line-height:1.18;max-width:78%;margin:10px 0 7px;letter-spacing:-.5px}.hero p{font-size:11px;line-height:1.55;color:#c3c0d6;max-width:78%;margin:0}.btn{border:0;border-radius:13px;padding:13px 16px;background:linear-gradient(135deg,#a18aff,#7254d6);font-size:12px;font-weight:850;box-shadow:0 8px 22px #7958d933}.btn:active{transform:scale(.98)}.btn.secondary{background:#293249;border:1px solid var(--line);box-shadow:none}.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--muted)}.btn.full{width:100%}.hero .btn{margin-top:15px;position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0 22px}.stat{padding:12px;border-radius:15px;background:var(--surface);border:1px solid var(--line)}.stat b{font-size:19px;display:block}.stat span{font-size:9px;color:var(--muted);display:block;margin-top:4px}.section{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.section h3{font-size:15px;margin:0}.section button{border:0;background:none;color:#b9aaff;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{border:1px solid var(--line);border-radius:16px;padding:8px;background:linear-gradient(150deg,#202a40,#151b2a);min-width:0;text-align:left;position:relative;overflow:hidden}.art{height:100px;border-radius:11px;display:grid;place-items:center;font-size:42px;background:radial-gradient(circle at 50% 25%,#ffffff27,transparent 55%),linear-gradient(145deg,var(--a),var(--b));position:relative}.art:after{content:"";position:absolute;inset:6px;border:1px solid #ffffff29;border-radius:8px}.rarity{position:absolute;top:7px;left:7px;z-index:1;border-radius:20px;background:#10131dc9;padding:4px 6px;font-size:7px;font-weight:900}.copies{position:absolute;top:7px;right:7px;z-index:1;border-radius:20px;background:#10131dc9;padding:4px 6px;font-size:8px}.card strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 1px 3px}.card small{font-size:8px;color:var(--muted);display:block;margin:0 1px 2px}.locked .art{filter:grayscale(.85) brightness(.5)}.locked strong{color:#8d96ab}.wide{display:flex;gap:12px;align-items:center;padding:13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin:9px 0}.wideicon{width:43px;height:43px;border-radius:13px;background:#30294b;display:grid;place-items:center;font-size:21px;flex-shrink:0}.widecopy{flex:1;min-width:0}.widecopy b{font-size:12px;display:block}.widecopy small{font-size:10px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}.tag{font-size:9px;padding:6px 8px;border-radius:20px;background:#332c50;color:#d4caff;white-space:nowrap}.progress{height:6px;background:#30384e;border-radius:10px;overflow:hidden;margin-top:9px}.progress i{height:100%;display:block;background:linear-gradient(90deg,#9277ff,#67d7df)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:8px 12px;background:var(--surface);font-size:10px;color:var(--muted)}.tabs button.active{background:#39315b;color:#e2dcff;border-color:#9277ff77}.product{background:linear-gradient(145deg,#202940,#171c2b);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}.productart{width:66px;height:76px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;font-size:32px;background:linear-gradient(145deg,#5c4a91,#24233e)}.productinfo{flex:1;min-width:0}.productinfo b{font-size:12px}.productinfo p{font-size:10px;line-height:1.4;color:var(--muted);margin:5px 0}.price{font-size:13px;font-weight:900;color:var(--gold)}.buy{padding:9px 12px;border:0;border-radius:10px;background:#45366f;color:#e6dfff;font-size:10px;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#101522ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:5}.nav button{background:none;border:0;color:#7e899f;font-size:9px;font-weight:800;padding:5px}.nav button span{display:block;font-size:19px;margin-bottom:4px}.nav button.active{color:#b8aaff}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:23px;background:#1a2131;border:1px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom));text-align:center}.modal h3{font-size:19px;margin:6px 0}.modal p{font-size:11px;line-height:1.55;color:var(--muted)}.bigart{width:145px;height:145px;margin:14px auto;border-radius:24px;display:grid;place-items:center;font-size:82px;background:linear-gradient(145deg,var(--a),var(--b));border:1px solid #ffffff33}.close{float:right;border:0;border-radius:50%;width:30px;height:30px;background:#30384c}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}.empty{grid-column:1/-1;border:1px dashed #46506a;border-radius:16px;text-align:center;padding:23px 14px;color:var(--muted);font-size:11px;line-height:1.5}.note{font-size:9px;line-height:1.5;color:#707c94;text-align:center;margin:18px 8px}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#f2edff;color:#1b1730;border-radius:24px;padding:11px 16px;font-size:11px;font-weight:900;z-index:40;box-shadow:0 8px 28px #0008;max-width:90%;text-align:center}.hide{display:none!important}.premium{background:linear-gradient(120deg,#4c3a20,#252033);border:1px solid #f2c66d55;border-radius:18px;padding:15px;margin:14px 0}.premium b{color:#f5d58d;font-size:13px}.premium p{font-size:10px;line-height:1.5;color:#c9bda4}.premium .btn{background:linear-gradient(135deg,#f1ce83,#b17a35);color:#21180d;box-shadow:none}.foot{font-size:9px;color:#737f97;text-align:center;line-height:1.5;margin:20px 4px}
@media(min-width:520px){.overlay{align-items:center}.modal{border-radius:23px}}
.search{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:13px 14px;color:var(--text);font:inherit;font-size:12px;outline:none;margin:5px 0 12px}.search:focus{border-color:#9277ff}.achievement-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 16px}.achievement{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:5px}.achievement span{font-size:21px}.achievement b{font-size:11px}.achievement small{font-size:9px;line-height:1.35;color:var(--muted)}.achievement em{font-style:normal;font-size:8px;color:#8792a8;margin-top:auto}.achievement.done{border-color:#9277ff77;background:linear-gradient(145deg,#282442,#171d2c)}.achievement.done em{color:#b7a5ff}.buy:disabled{opacity:.35;cursor:not-allowed}</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><small>СОБИРАЙ • ОТКРЫВАЙ • ОБМЕНИВАЙ</small><strong>COLLECT</strong></div></div><button class="avatar" id="profileBtn" aria-label="Профиль">☺</button></header>
<main id="main"></main></div>
<nav class="nav"><button data-page="home" class="active"><span>⌂</span>Главная</button><button data-page="album"><span>▦</span>Коллекция</button><button data-page="shop"><span>♢</span>Магазин</button><button data-page="exchange"><span>⇄</span>Обмен</button></nav>
<div class="overlay" id="overlay"><section class="modal" id="modal"></section></div><div id="toast" class="toast hide"></div>
<script>
(function(){
'use strict';
const STORE='collect.pro.v1';
const cards=[
['aurora','Северное сияние','🌌','Обычная','#345d86','#20364d'],['fox','Рыжий хранитель','🦊','Обычная','#a65b38','#4d2931'],['moon','Лунный кот','🐈‍⬛','Редкая','#5a4d89','#25213f'],['planet','Сатурн','🪐','Обычная','#98734a','#4d3a39'],['crystal','Кристалл','💎','Редкая','#287b91','#233d6b'],['phoenix','Феникс','🔥','Эпическая','#b44d42','#54253e'],['mushroom','Лесной гриб','🍄','Обычная','#b65b66','#623e61'],['crown','Корона','👑','Эпическая','#a77c34','#57402a'],['whale','Кит мечты','🐋','Редкая','#397d9a','#263d68'],['dragon','Дракон','🐉','Легендарная','#3d946e','#203e42'],['star','Падающая звезда','🌠','Редкая','#6755a6','#31274f'],['butterfly','Ночная бабочка','🦋','Обычная','#477cae','#3d356c'],['robot','Робот 007','🤖','Эпическая','#63788a','#303e54'],['heart','Сердце океана','🩵','Редкая','#368d9c','#254a69'],['unicorn','Единорог','🦄','Легендарная','#9b66a8','#59447e'],['key','Золотой ключ','🗝️','Эпическая','#a17a3e','#51402c'],['owl','Мудрая сова','🦉','Обычная','#8c684b','#453b3a'],['comet','Комета','☄️','Легендарная','#b65b83','#4c315f'],['sakura','Сакура','🌸','Обычная','#b46e91','#573b62'],['jelly','Медуза','🪼','Редкая','#397da0','#293d6c'],['sphinx','Сфинкс','🐈','Эпическая','#997b51','#49394a'],['meteor','Метеорит','☄️','Легендарная','#9a5746','#38283b'],['panda','Панда','🐼','Обычная','#626e82','#292e40'],['emerald','Изумруд','🟢','Редкая','#398c68','#21433d']
].map(a=>({id:a[0],name:a[1],emoji:a[2],rarity:a[3],a:a[4],b:a[5]}));
const seasonSets=[{name:'Космическая одиссея',ids:['aurora','moon','planet','crystal','star','comet']},{name:'Магия природы',ids:['fox','mushroom','butterfly','owl','sakura','panda']},{name:'Легенды стихий',ids:['phoenix','dragon','whale','jelly','emerald','meteor']},{name:'Тайны древних',ids:['crown','unicorn','key','sphinx','robot','heart']}];
const SEASON_EPOCH=new Date(2026,10,13).getTime(),SEASON_MS=30*86400000;
const products=[{id:'pack5',name:'Малый набор',desc:'5 случайных карточек. Отличный старт.',price:49,emoji:'🎴',kind:'pack',qty:5},{id:'pack12',name:'Большой набор',desc:'12 карточек и повышенный шанс редких.',price:99,emoji:'💎',kind:'pack',qty:12},{id:'premium',name:'COLLECT PLUS',desc:'Эксклюзивный профиль, рамка и +1 бесплатный набор ежедневно в течение 30 дней.',price:149,emoji:'👑',kind:'premium'}];
let state={owned:{},fragments:0,lastFree:'',opened:0,plusUntil:0,streakDate:'',streakCount:0,seasonClaims:{}};let page='home',filter='Все',giftId=null,dailyReward=0;
const $=s=>document.querySelector(s),main=$('#main'),overlay=$('#overlay'),modal=$('#modal');
function load(){try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')};}catch(e){}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function applyDailyStreak(){const t=today();if(state.streakDate===t)return;state.streakCount=state.streakDate===yesterday()?((Number(state.streakCount)||0)%7)+1:1;state.streakDate=t;dailyReward=[5,7,10,12,15,20,50][state.streakCount-1];state.fragments=(Number(state.fragments)||0)+dailyReward;save();}

function ensureDailyQuests(){if(state.questDate!==today()){state.questDate=today();state.questProgress={};state.questClaims={};save()}state.questProgress=state.questProgress||{};state.questClaims=state.questClaims||{}}
function trackQuest(id){ensureDailyQuests();state.questProgress[id]=true;save()}
function claimQuest(id){ensureDailyQuests();const defs={pack:{reward:10},album:{reward:5},season:{reward:5}},q=defs[id];if(!q||!state.questProgress[id]||state.questClaims[id])return;state.questClaims[id]=true;state.fragments=(Number(state.fragments)||0)+q.reward;save();home();toast('Задание выполнено: +'+q.reward+' осколков')}
function questPanel(){ensureDailyQuests();const defs=[['pack','🎴','Открой любой набор',10],['album','🗂️','Загляни в альбом',5],['season','🏆','Посети сезонную коллекцию',5]];return '<div class="section"><h3>Задания дня</h3><span class="tag">'+defs.filter(d=>state.questProgress[d[0]]).length+' / 3</span></div>'+defs.map(d=>'<div class="wide"><div class="wideicon">'+d[1]+'</div><div class="widecopy"><b>'+d[2]+'</b><small>Награда: '+d[3]+' осколков</small></div>'+(state.questClaims[d[0]]?'<span class="tag">Получено ✓</span>':state.questProgress[d[0]]?'<button class="buy" data-quest="'+d[0]+'">Забрать</button>':'<span class="tag">В процессе</span>')+'</div>').join('')}
function activeSeason(){const n=Math.max(0,Math.floor((Date.now()-SEASON_EPOCH)/SEASON_MS)),set=seasonSets[n%seasonSets.length],start=SEASON_EPOCH+n*SEASON_MS,end=start+SEASON_MS;return {id:'season-'+n,name:set.name,ids:set.ids,start,end,daysLeft:Math.max(0,Math.ceil((end-Date.now())/86400000)),number:n+1}}
function seasonProgress(){const x=activeSeason(),count=x.ids.filter(id=>state.owned[id]>0).length;return {...x,count,complete:count===x.ids.length,claimed:!!(state.seasonClaims&&state.seasonClaims[x.id]),rank:count>=6?'Легенда':count>=4?'Мастер':count>=2?'Исследователь':'Новичок'}}
function claimSeasonReward(){const p=seasonProgress();if(!p.complete||p.claimed){toast(p.claimed?'Награда уже получена':'Собери всю сезонную серию');return}state.seasonClaims=state.seasonClaims||{};state.seasonClaims[p.id]=true;state.fragments=(Number(state.fragments)||0)+100;save();season();toast('Сезон завершён! +100 осколков')}
function season(){trackQuest('season');const p=seasonProgress(),list=p.ids.map(id=>card(id));main.innerHTML='<h1 class="title">Сезон '+p.number+'</h1><p class="subtitle">'+p.name+' · ограниченная подборка на 30 дней. Собери все 6 карточек до завершения сезона.</p><section class="hero"><div class="eyebrow">СЕЗОННЫЙ ПРОГРЕСС</div><h2>Твой ранг: '+p.rank+'</h2><p>До конца сезона: '+p.daysLeft+' дн. За полную серию получишь 100 осколков.</p><div class="progress"><i style="width:'+(p.count/6*100)+'%"></i></div><p style="margin-top:8px">Собрано '+p.count+' из 6 карточек</p><button class="btn '+(p.complete&&!p.claimed?'':'secondary')+'" id="seasonClaim" '+(!p.complete||p.claimed?'disabled':'')+'>'+(p.claimed?'Награда получена ✓':p.complete?'Забрать 100 осколков':'Собери всю серию')+'</button></section><div class="section"><h3>Карточки сезона</h3><span class="tag">'+p.count+' / 6</span></div><div class="grid">'+list.map(c=>cardView(c,!!state.owned[c.id])).join('')+'</div><div class="section"><h3>Сезонные ранги</h3></div><div class="achievement-grid">'+[['🌱','Новичок','0–1 карточка'],['🧭','Исследователь','2–3 карточки'],['💎','Мастер','4–5 карточек'],['👑','Легенда','Все 6 карточек']].map((r,i)=>'<div class="achievement '+((i===0&&p.count<2)||(i===1&&p.count>=2&&p.count<4)||(i===2&&p.count>=4&&p.count<6)||(i===3&&p.count===6)?'done':'')+'"><span>'+r[0]+'</span><b>'+r[1]+'</b><small>'+r[2]+'</small></div>').join('')+'</div><p class="note">Серия сезона формируется из карточек твоего альбома. Прогресс и награда пока хранятся только на этом устройстве. Общий рейтинг игроков появится после подключения сервера и авторизации MAX.</p>'}
function plus(){return state.plusUntil>Date.now()}
function achievements(){const defs=[['🌱','Первый шаг','Открой первую карточку',unique()>=1],['🗂️','Собиратель','Собери 5 разных карточек',unique()>=5],['💠','Охотник за редкостями','Найди эпическую карточку',cards.some(x=>x.rarity==='Эпическая'&&state.owned[x.id])],['👑','Легенда','Найди легендарную карточку',cards.some(x=>x.rarity==='Легендарная'&&state.owned[x.id])],['🎴','Открытия','Открой 10 карточек',state.opened>=10],['✨','Полный альбом','Собери всю коллекцию',unique()===cards.length]];return '<div class="achievement-grid">'+defs.map(d=>'<div class="achievement '+(d[3]?'done':'')+'"><span>'+d[0]+'</span><b>'+d[1]+'</b><small>'+d[2]+'</small><em>'+(d[3]?'Получено':'В процессе')+'</em></div>').join('')+'</div>'}
function total(){return Object.values(state.owned).reduce((n,v)=>n+(+v||0),0)}
function unique(){return Object.keys(state.owned).filter(k=>state.owned[k]>0).length}
function card(id){return cards.find(c=>c.id===id)}
function rarityColor(r){return r==='Легендарная'?'#f2c66d':r==='Эпическая'?'#ed8fbd':r==='Редкая'?'#67d7df':'#aab3c7'}
function toast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2300)}
function cardView(c,owned=true){return '<button class="card '+(owned?'':'locked')+'" data-card="'+c.id+'"><div class="art" style="--a:'+c.a+';--b:'+c.b+'"><span class="rarity" style="color:'+rarityColor(c.rarity)+'">'+c.rarity+'</span>'+(owned&&state.owned[c.id]>1?'<span class="copies">×'+state.owned[c.id]+'</span>':'')+'<span>'+(owned?c.emoji:'?')+'</span></div><strong>'+(owned?c.name:'Не открыта')+'</strong><small>'+c.rarity+'</small></button>'}
function modalOpen(html){modal.innerHTML=html;overlay.classList.add('show');const x=$('#x');if(x)x.onclick=()=>overlay.classList.remove('show')}
function openCard(id){const c=card(id);if(!c||!state.owned[id])return;modalOpen('<button class="close" id="x">×</button><div class="eyebrow">КАРТОЧКА ИЗ ТВОЕГО АЛЬБОМА</div><div class="bigart" style="--a:'+c.a+';--b:'+c.b+'">'+c.emoji+'</div><h3>'+c.name+'</h3><p>'+c.rarity+' · В коллекции: '+state.owned[id]+'</p><div class="actions"><button class="btn secondary" id="shareCard">Поделиться</button><button class="btn" id="done">Готово</button></div>');$('#done').onclick=()=>overlay.classList.remove('show');$('#shareCard').onclick=()=>{giftId=id;shareGift()}}
function openPack(qty=1,paid=false){trackQuest('pack');const results=[];for(let i=0;i<qty;i++){const pool=cards.flatMap(c=>Array(c.rarity==='Легендарная'?1:c.rarity==='Эпическая'?2:c.rarity==='Редкая'?4:8).fill(c.id));const id=pool[Math.floor(Math.random()*pool.length)],dup=!!state.owned[id];state.owned[id]=(state.owned[id]||0)+1;if(dup)state.fragments+=10;results.push({c:card(id),dup})}state.opened+=qty;if(!paid)state.lastFree=today();save();const first=results[0];modalOpen('<button class="close" id="x">×</button><div class="eyebrow">'+(qty>1?'НАБОР ОТКРЫТ':'ТВОЯ НАХОДКА')+'</div><div class="bigart" style="--a:'+first.c.a+';--b:'+first.c.b+'">'+first.c.emoji+'</div><h3>'+(qty>1?'Ты открыл '+qty+' карточек':first.c.name)+'</h3><p>'+results.map(r=>r.c.emoji+' '+r.c.name+(r.dup?' · повтор +10 осколков':'')).join('<br>')+'</p><button class="btn full" id="done">В альбом</button>');$('#done').onclick=()=>{overlay.classList.remove('show');render()}}
function giftImport(){if(!location.hash.startsWith('#gift='))return;try{const p=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(6))))),c=card(p.id);location.hash='';if(!c)return;modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ТЕБЕ ПОДАРОК</div><div class="bigart" style="--a:'+c.a+';--b:'+c.b+'">'+c.emoji+'</div><h3>'+c.name+'</h3><p>Друг поделился карточкой из своей коллекции. Добавь её в свой альбом.</p><button class="btn full" id="claim">Забрать карточку</button>');$('#claim').onclick=()=>{state.owned[c.id]=(state.owned[c.id]||0)+1;save();overlay.classList.remove('show');render();toast('Карточка добавлена!')}}catch(e){toast('Не удалось открыть подарок')}}
function shareGift(){const c=card(giftId),payload=btoa(unescape(encodeURIComponent(JSON.stringify({id:giftId}))));const url=location.href.split('#')[0]+'#gift='+payload;const msg='Дарю тебе карточку «'+c.name+'» из COLLECT! Забирай: '+url;if(navigator.share){navigator.share({title:'Подарок из COLLECT',text:msg,url}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(msg).then(()=>toast('Ссылка скопирована')).catch(()=>toast('Не удалось скопировать ссылку'))}else{modalOpen('<h3>Ссылка на подарок</h3><p style="word-break:break-all">'+url+'</p><button class="btn full" id="x">Закрыть</button>')}}
function buy(id){const p=products.find(x=>x.id===id);if(!p)return;modalOpen('<button class="close" id="x">×</button><div class="bigart" style="--a:#57427e;--b:#24243e">'+p.emoji+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="price" style="font-size:20px;margin:14px">₽ '+p.price+'</div><p>Платёжный модуль пока не подключён. Покупка не будет списывать деньги.</p><button class="btn full" id="paymentInfo">Как подключить оплату</button>');$('#paymentInfo').onclick=()=>{modalOpen('<h3>Подключение оплаты</h3><p>Для настоящих покупок нужен платёжный провайдер и серверный обработчик подтверждения платежа. После подключения кнопка будет создавать заказ, а набор начисляться только после подтверждённого уведомления от провайдера.</p><button class="btn full" id="x">Понятно</button>')}}
function home(){ensureDailyQuests();const used=state.lastFree===today(),owned=cards.filter(c=>state.owned[c.id]).slice(-3).reverse();main.innerHTML='<h1 class="title">Твоя коллекция</h1><p class="subtitle">Открывай серии, находи редкие карточки и делись находками с друзьями.</p><section class="hero"><div class="eyebrow">'+(plus()?'COLLECT PLUS':'ЕЖЕДНЕВНЫЙ БОНУС')+'</div><h2>'+(used?'Следующий набор завтра':'Твоя следующая редкая находка')+'</h2><p>Каждый день — один бесплатный набор. Редкие и легендарные карточки выпадают значительно реже.</p><button class="btn" id="freePack">'+(used?'Бесплатный набор получен ✓':'Открыть бесплатный набор')+'</button></section><div class="wide"><div class="wideicon">🔥</div><div class="widecopy"><b>Серия входов: '+(state.streakCount||0)+' / 7 дней</b><small>'+(dailyReward?'Сегодня получено +'+dailyReward+' осколков. ':'')+'Следующая награда: '+[5,7,10,12,15,20,50][(state.streakCount||0)%7]+' осколков. Заходи каждый день, чтобы сохранить серию.</small><div class="progress"><i style="width:'+Math.min(100,(state.streakCount||0)/7*100)+'%"></i></div></div><span class="tag">День '+(state.streakCount||0)+'</span></div><div class="stats"><div class="stat"><b>'+unique()+'<small style="font-size:10px;color:var(--muted)"> / '+cards.length+'</small></b><span>Уникальных карточек</span></div><div class="stat"><b>'+total()+'</b><span>Всего экземпляров</span></div><div class="stat"><b>'+state.fragments+'</b><span>Осколков</span></div></div>'+questPanel()+'<div class="section"><h3>Сезонная серия</h3><button data-page="season">Открыть сезон →</button></div><div class="wide"><div class="wideicon">🏆</div><div class="widecopy"><b>Сезон '+activeSeason().number+': '+seasonProgress().name+'</b><small>Собрано '+seasonProgress().count+' из 6 · ранг '+seasonProgress().rank+' · награда 100 осколков</small><div class="progress"><i style="width:'+seasonProgress().count/6*100+'%"></i></div></div><button class="buy" data-page="season">Играть</button></div><div class="section"><h3>Мой прогресс</h3><button data-page="album">Открыть альбом →</button></div><div class="wide"><div class="widecopy"><b>'+Math.round(unique()/cards.length*100)+'% коллекции собрано</b><small>'+unique()+' из '+cards.length+' уникальных карточек</small><div class="progress"><i style="width:'+unique()/cards.length*100+'%"></i></div></div></div><div class="section"><h3>Последние находки</h3><button data-page="album">Весь альбом →</button></div><div class="grid">'+(owned.map(c=>cardView(c)).join('')||'<div class="empty">Здесь появятся твои первые карточки. Открой бесплатный набор!</div>')+'</div><div class="section"><h3>Достижения</h3><span class="tag">'+(achievements().match(/class="achievement done"/g)||[]).length+' / 6</span></div>'+achievements()+'<div class="wide"><div class="widecopy"><b>Шансы выпадения карточек</b><small>Обычная — 60,4% · Редкая — 26,4% · Эпическая — 9,4% · Легендарная — 3,8%*</small></div></div><p class="note">*Ориентировочные шансы текущего набора.</p><section class="premium"><b>✦ COLLECT PLUS</b><p>Особая рамка профиля, значок коллекционера и дополнительный бесплатный набор каждый день на 30 дней.</p><button class="btn" id="plusOffer">Открыть преимущества · 149 ₽</button></section>'}
function album(){trackQuest('album');let list=cards.filter(c=>(filter==='Все'||c.rarity===filter)&&(!window.albumQuery||c.name.toLowerCase().includes(window.albumQuery.toLowerCase())));main.innerHTML='<h1 class="title">Мой альбом</h1><p class="subtitle">Твоя личная коллекция из '+cards.length+' карточек. Ищи находки и собирай полный набор.</p><input id="albumSearch" class="search" placeholder="⌕  Найти карточку..." value="'+(window.albumQuery||'')+'"><div class="wide"><div class="widecopy"><b>'+unique()+' / '+cards.length+' собрано</b><div class="progress"><i style="width:'+unique()/cards.length*100+'%"></i></div></div><span class="tag">'+Math.round(unique()/cards.length*100)+'%</span></div><div class="tabs">'+['Все','Обычная','Редкая','Эпическая','Легендарная'].map(x=>'<button class="'+(filter===x?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</div><div class="grid">'+list.map(c=>cardView(c,!!state.owned[c.id])).join('')+'</div><p class="note">Пока прогресс сохраняется на этом устройстве. Облачная синхронизация появится после подключения серверного хранилища.</p>'}
function shop(){main.innerHTML='<h1 class="title">Магазин</h1><p class="subtitle">Дополнительные наборы и возможности для твоей коллекции.</p><section class="hero"><div class="eyebrow">МАГАЗИН COLLECT</div><h2>Больше открытий. Больше редкостей.</h2><p>Покупки будут доступны после подключения безопасной онлайн-оплаты.</p></section>'+products.map(p=>'<div class="product"><div class="productart">'+p.emoji+'</div><div class="productinfo"><b>'+p.name+'</b><p>'+p.desc+'</p><span class="price">'+p.price+' ₽</span></div><button class="buy" data-buy="'+p.id+'">Выбрать</button></div>').join('')+'<p class="foot">Все цены указаны в рублях. Оплата пока отключена: нажатие не создаёт заказ и не списывает деньги.</p>'}
function exchange(){const owned=cards.filter(c=>state.owned[c.id]);main.innerHTML='<h1 class="title">Обмен и подарки</h1><p class="subtitle">Используй осколки для новых наборов или делись находками с друзьями.</p><div class="wide"><div class="wideicon">✧</div><div class="widecopy"><b>'+state.fragments+' осколков на балансе</b><small>50 осколков = 1 дополнительный набор. Повторы карточек пополняют баланс.</small></div><button class="buy" data-redeem="1" '+(state.fragments<50?'disabled':'')+'>Обменять</button></div><section class="hero"><div class="eyebrow">КОЛЛЕКЦИОНИРУЙ ВМЕСТЕ</div><h2>Поделись своей находкой</h2><p>Каждая подарочная ссылка открывает выбранную карточку для друга.</p></section><div class="section"><h3>Выбери карточку</h3><span class="tag">'+owned.length+' доступно</span></div><div class="grid">'+(owned.map(c=>'<button class="card" data-gift="'+c.id+'"><div class="art" style="--a:'+c.a+';--b:'+c.b+'">'+c.emoji+'</div><strong>'+c.name+'</strong><small>Подарить другу</small></button>').join('')||'<div class="empty">Пока нет карточек для подарка. Открой бесплатный набор на главной.</div>')+'</div><p class="note">Подарок создаёт копию карточки. Это не серверный обмен: ссылка может быть открыта несколько раз.</p>'}
function profile(){modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ПРОФИЛЬ КОЛЛЕКЦИОНЕРА</div><div class="bigart" style="--a:#51447f;--b:#25223f">'+(plus()?'👑':'☺')+'</div><h3>'+(plus()?'COLLECT PLUS':'Коллекционер')+'</h3><p>Уникальных карточек: '+unique()+' из '+cards.length+'<br>Всего экземпляров: '+total()+'<br>Открыто наборов: '+state.opened+'<br>Осколков: '+state.fragments+'<br>Серия входов: '+(state.streakCount||0)+' дней<br>Статус PLUS: '+(plus()?'активен до '+new Date(state.plusUntil).toLocaleDateString('ru-RU'):'не подключён')+'</p><div class="actions"><button class="btn secondary" id="backup">Экспорт копии</button><button class="btn secondary" id="restore">Импорт копии</button><button class="btn" id="ok">Готово</button></div><input id="backupFile" type="file" accept="application/json,.json" hidden><p class="note">Копия переносит прогресс между устройствами вручную. Профиль пока локальный, без авторизации MAX и облачной синхронизации.</p>');$('#ok').onclick=()=>overlay.classList.remove('show');$('#backup').onclick=()=>{const backup={app:'COLLECT',version:1,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='collect-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия сохранена')};$('#restore').onclick=()=>$('#backupFile').click()}
function redeemFragments(){if(state.fragments<50){toast('Нужно ещё '+(50-state.fragments)+' осколков');return}state.fragments-=50;save();openPack(1,true);toast('Осколки обменяны на набор')}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();if(page==='album')album();if(page==='shop')shop();if(page==='exchange')exchange();if(page==='season')season()}
$('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
main.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;window.albumQuery='';album();return}const r=e.target.closest('[data-redeem]');if(r){redeemFragments();return}const b=e.target.closest('[data-buy]');if(b){buy(b.dataset.buy);return}const g=e.target.closest('[data-gift]');if(g){giftId=g.dataset.gift;shareGift();return}const c=e.target.closest('[data-card]');if(c){openCard(c.dataset.card);return}if(e.target.closest('#freePack')){if(state.lastFree===today()){toast('Бесплатный набор уже получен сегодня');return}openPack(1,false);return}if(e.target.closest('#plusOffer')){buy('premium');return}if(e.target.closest('#seasonClaim')){claimSeasonReward();return}const q=e.target.closest('[data-quest]');if(q){claimQuest(q.dataset.quest)}});
main.addEventListener('input',e=>{if(e.target.id==='albumSearch'){window.albumQuery=e.target.value;const grid=main.querySelector('.grid');if(grid){const list=cards.filter(c=>(filter==='Все'||c.rarity===filter)&&c.name.toLowerCase().includes(window.albumQuery.toLowerCase()));grid.innerHTML=list.map(c=>cardView(c,!!state.owned[c.id])).join('')||'<div class="empty">Ничего не найдено. Попробуй другое название.</div>'}}});
modal.addEventListener('change',async e=>{if(e.target.id!=='backupFile'||!e.target.files||!e.target.files[0])return;try{const raw=JSON.parse(await e.target.files[0].text()),data=raw&&raw.app==='COLLECT'&&raw.version===1?raw.data:raw;if(!data||typeof data!=='object'||Array.isArray(data)||!data.owned||typeof data.owned!=='object'||Array.isArray(data.owned))throw new Error('Формат копии не распознан');const owned={};for(const [id,count] of Object.entries(data.owned)){if(!card(id)||!Number.isInteger(count)||count<0||count>9999)throw new Error('В копии обнаружены некорректные карточки');if(count>0)owned[id]=count}const integer=(v,d=0)=>Number.isInteger(v)&&v>=0?v:d;if(data.fragments!==undefined&&(!Number.isInteger(data.fragments)||data.fragments<0||data.fragments>100000000))throw new Error('Некорректный баланс осколков');if(data.opened!==undefined&&(!Number.isInteger(data.opened)||data.opened<0||data.opened>100000000))throw new Error('Некорректное число открытий');const restored={owned,fragments:integer(data.fragments),lastFree:typeof data.lastFree==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.lastFree)?data.lastFree:'',opened:integer(data.opened),plusUntil:Number.isFinite(data.plusUntil)&&data.plusUntil>0?data.plusUntil:0,seasonClaims:data.seasonClaims&&typeof data.seasonClaims==='object'&&!Array.isArray(data.seasonClaims)?Object.fromEntries(Object.entries(data.seasonClaims).filter(([k,v])=>/^season-\d+$/.test(k)&&v===true)): {},questDate:typeof data.questDate==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(data.questDate)?data.questDate:'',questProgress:data.questProgress&&typeof data.questProgress==='object'&&!Array.isArray(data.questProgress)?Object.fromEntries(Object.entries(data.questProgress).filter(([k,v])=>['pack','album','season'].includes(k)&&v===true)): {},questClaims:data.questClaims&&typeof data.questClaims==='object'&&!Array.isArray(data.questClaims)?Object.fromEntries(Object.entries(data.questClaims).filter(([k,v])=>['pack','album','season'].includes(k)&&v===true)): {},streakDate:typeof data.streakDate==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(data.streakDate)?data.streakDate:'',streakCount:Number.isInteger(data.streakCount)&&data.streakCount>=0&&data.streakCount<=7?data.streakCount:0};if(!window.confirm('Заменить текущий прогресс данными из резервной копии? Текущий прогресс будет перезаписан.'))return;state=restored;save();overlay.classList.remove('show');render();toast('Прогресс восстановлен из копии')}catch(err){toast(err.message==='Формат копии не распознан'||err.message==='Некорректный баланс осколков'||err.message==='Некорректное число открытий'||err.message==='В копии обнаружены некорректные карточки'?err.message:'Не удалось прочитать файл копии')}});
$('#profileBtn').onclick=profile;
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('show')});
load();applyDailyStreak();render();giftImport();if(dailyReward)toast('Ежедневная награда: +'+dailyReward+' осколков');
})();
</script></body></html>
