<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10121c"><title>КОЛЛЕКЦИЯ — собирай редкое</title>
<style>
:root{color-scheme:dark;--bg:#10121c;--panel:#191d2b;--panel2:#22283a;--line:#ffffff14;--muted:#929bb2;--text:#f7f8ff;--violet:#9275ff;--cyan:#6dd7df;--pink:#f28cbd;--gold:#f4c66a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#46366c66,transparent 48%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#a48bff,#6449c9);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px #785ce955}.brand small{display:block;color:#a99aff;font-size:9px;letter-spacing:2px;font-weight:900}.brand b{font-size:17px;letter-spacing:.4px}.avatar{width:40px;height:40px;border-radius:50%;background:#252a3c;border:1px solid var(--line);font-size:19px}.heading{font-size:28px;letter-spacing:-1px;font-weight:850;margin:12px 0 5px}.sub{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 20px}.hero{position:relative;overflow:hidden;border:1px solid #a18bff45;border-radius:25px;padding:20px;background:linear-gradient(125deg,#382d61,#1b2034 72%);margin-bottom:18px}.hero:after{content:"✦";position:absolute;right:14px;top:-23px;font-size:150px;color:#c4b5ff20}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.7px;color:#c2b5ff}.hero h2{font-size:23px;line-height:1.2;max-width:75%;margin:10px 0 7px}.hero p{font-size:12px;line-height:1.5;color:#c4c0db;max-width:75%;margin:0}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#a18aff,#7056d9);box-shadow:0 8px 22px #7657d944}.btn:active{transform:scale(.98)}.btn.secondary{background:#292f45;box-shadow:none;border:1px solid var(--line)}.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--muted)}.btn.full{width:100%}.hero .btn{margin-top:15px;position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0 22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 11px}.stat b{display:block;font-size:19px}.stat span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.section h3{font-size:16px;margin:0}.section button{background:none;border:0;color:#b7a9ff;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{min-width:0;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:17px;padding:9px;background:linear-gradient(150deg,#252b40,#191e2c);text-align:left}.art{height:105px;border-radius:12px;display:grid;place-items:center;font-size:45px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#ffffff26,transparent 55%),linear-gradient(145deg,var(--c1),var(--c2))}.art:after{content:"";position:absolute;inset:7px;border:1px solid #ffffff28;border-radius:9px}.card b{display:block;font-size:11px;margin:9px 1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{display:block;color:var(--muted);font-size:9px;margin:0 1px 2px}.rarity{position:absolute;z-index:1;top:8px;left:8px;background:#10121caa;border:1px solid #ffffff25;border-radius:20px;padding:4px 6px;font-size:8px;font-weight:800}.owned{position:absolute;right:8px;top:8px;background:#121522bb;border-radius:20px;padding:4px 6px;font-size:9px}.locked .art{filter:grayscale(.7) brightness(.55)}.locked b{color:#8991a7}.widecard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}.wideicon{width:45px;height:45px;border-radius:14px;background:#30294b;display:grid;place-items:center;font-size:22px;flex-shrink:0}.widecopy{flex:1;min-width:0}.widecopy b{display:block;font-size:13px}.widecopy small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:4px}.pill{font-size:10px;color:#d2c7ff;background:#39315a;padding:6px 9px;border-radius:20px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(3,1fr);padding:9px 12px calc(10px + env(safe-area-inset-bottom));background:#121521ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:5}.nav button{background:none;border:0;color:#858da4;font-size:10px;font-weight:700;padding:6px}.nav button span{display:block;font-size:20px;margin-bottom:4px}.nav button.active{color:#b8aaff}.overlay{display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px;background:#1b2030;border:1px solid var(--line);padding:20px 17px calc(18px + env(safe-area-inset-bottom));text-align:center}.modal h3{margin:4px 0 8px;font-size:20px}.modal p{font-size:12px;color:var(--muted);line-height:1.5}.modal .bigart{font-size:90px;margin:15px auto;width:150px;height:150px;border-radius:25px;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid #ffffff35}.modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions>*{flex:1}.close{float:right;border:0;background:#30364a;border-radius:50%;width:32px;height:32px}.empty{border:1px dashed #454c65;border-radius:18px;text-align:center;padding:25px 15px;color:var(--muted);font-size:12px;line-height:1.5}.progress{height:7px;background:#30364a;border-radius:9px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8c75ff,#6dd7df);border-radius:9px}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#f4f0ff;color:#1d1930;border-radius:25px;padding:11px 17px;font-size:12px;font-weight:800;z-index:40;box-shadow:0 8px 30px #0008;max-width:90%}.hide{display:none!important}.note{font-size:10px;color:#778098;line-height:1.5;text-align:center;margin:18px 8px}@media(min-width:520px){.overlay{align-items:center}.modal{border-radius:24px}} 
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><small>СОБИРАЙ • ОТКРЫВАЙ • МЕНЯЙСЯ</small><b>МОЯ КОЛЛЕКЦИЯ</b></div></div><button class="avatar" id="profileBtn" aria-label="Профиль">☺</button></header>
<main id="main"></main></div>
<nav class="nav"><button data-page="home" class="active"><span>⌂</span>Главная</button><button data-page="album"><span>▦</span>Альбом</button><button data-page="exchange"><span>⇄</span>Обмен</button></nav>
<div class="overlay" id="overlay"><section class="modal" id="modal"></section></div><div id="toast" class="toast hide"></div>
<script>
(function(){
'use strict';
const KEY='myCollection.v1';
const cards=[
{id:'aurora',name:'Северное сияние',emoji:'🌌',rarity:'Обычная',c1:'#345d86',c2:'#20364d'},
{id:'fox',name:'Рыжий хранитель',emoji:'🦊',rarity:'Обычная',c1:'#a65b38',c2:'#4d2931'},
{id:'moon',name:'Лунный кот',emoji:'🐈‍⬛',rarity:'Редкая',c1:'#5a4d89',c2:'#25213f'},
{id:'planet',name:'Сатурн',emoji:'🪐',rarity:'Обычная',c1:'#98734a',c2:'#4d3a39'},
{id:'crystal',name:'Кристалл',emoji:'💎',rarity:'Редкая',c1:'#287b91',c2:'#233d6b'},
{id:'phoenix',name:'Феникс',emoji:'🔥',rarity:'Эпическая',c1:'#b44d42',c2:'#54253e'},
{id:'mushroom',name:'Лесной гриб',emoji:'🍄',rarity:'Обычная',c1:'#b65b66',c2:'#623e61'},
{id:'crown',name:'Корона',emoji:'👑',rarity:'Эпическая',c1:'#a77c34',c2:'#57402a'},
{id:'whale',name:'Кит мечты',emoji:'🐋',rarity:'Редкая',c1:'#397d9a',c2:'#263d68'},
{id:'dragon',name:'Дракон',emoji:'🐉',rarity:'Легендарная',c1:'#3d946e',c2:'#203e42'},
{id:'star',name:'Падающая звезда',emoji:'🌠',rarity:'Редкая',c1:'#6755a6',c2:'#31274f'},
{id:'butterfly',name:'Ночная бабочка',emoji:'🦋',rarity:'Обычная',c1:'#477cae',c2:'#3d356c'},
{id:'robot',name:'Робот 007',emoji:'🤖',rarity:'Эпическая',c1:'#63788a',c2:'#303e54'},
{id:'heart',name:'Сердце океана',emoji:'🩵',rarity:'Редкая',c1:'#368d9c',c2:'#254a69'},
{id:'unicorn',name:'Единорог',emoji:'🦄',rarity:'Легендарная',c1:'#9b66a8',c2:'#59447e'},
{id:'key',name:'Золотой ключ',emoji:'🗝️',rarity:'Эпическая',c1:'#a17a3e',c2:'#51402c'},
{id:'owl',name:'Мудрая сова',emoji:'🦉',rarity:'Обычная',c1:'#8c684b',c2:'#453b3a'},
{id:'comet',name:'Комета',emoji:'☄️',rarity:'Легендарная',c1:'#b65b83',c2:'#4c315f'}
];
let data={owned:{},fragments:0,lastPack:'',opened:0};
let page='home',chosenGift=null;
const main=document.getElementById('main'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');data={...data,...d};data.owned=data.owned||{};}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function count(){return Object.values(data.owned).reduce((a,b)=>a+(Number(b)||0),0)}
function unique(){return Object.keys(data.owned).filter(k=>data.owned[k]>0).length}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hide'),2200)}
function get(id){return cards.find(c=>c.id===id)}
function rarityColor(r){return r==='Легендарная'?'#f4c66a':r==='Эпическая'?'#f28cbd':r==='Редкая'?'#6dd7df':'#a9b1c5'}
function cardHTML(c,owned=true){return '<button class="card '+(owned?'':'locked')+'" data-card="'+c.id+'"><div class="art" style="--c1:'+c.c1+';--c2:'+c.c2+'"><span class="rarity" style="color:'+rarityColor(c.rarity)+'">'+c.rarity+'</span>'+(owned&&data.owned[c.id]>1?'<span class="owned">×'+data.owned[c.id]+'</span>':'')+'<span>'+ (owned?c.emoji:'?')+'</span></div><b>'+ (owned?c.name:'Не открыта')+'</b><small>'+c.rarity+'</small></button>'}
function giftImport(){const hash=location.hash;if(!hash.startsWith('#gift='))return;try{const payload=JSON.parse(decodeURIComponent(escape(atob(hash.slice(6)))));const c=get(payload.id);if(!c)return;location.hash='';modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ТЕБЕ ПОДАРОК</div><div class="bigart" style="--c1:'+c.c1+';--c2:'+c.c2+'">'+c.emoji+'</div><h3>'+c.name+'</h3><p>Друг поделился с тобой карточкой из своей коллекции.</p><button class="btn full" id="claim">Забрать карточку</button>',()=>{data.owned[c.id]=(data.owned[c.id]||0)+1;save();toast('Карточка добавлена в альбом!');render();});}catch(e){toast('Ссылка на подарок повреждена');}}
function modalOpen(html,onClaim){modal.innerHTML=html;overlay.classList.add('show');const x=document.getElementById('x');if(x)x.onclick=()=>overlay.classList.remove('show');const claim=document.getElementById('claim');if(claim)claim.onclick=()=>{overlay.classList.remove('show');onClaim&&onClaim()};}
function openCard(id){const c=get(id);if(!c)return;if(!data.owned[id]){toast('Эта карточка ещё не открыта');return;}modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ТВОЯ КАРТОЧКА</div><div class="bigart" style="--c1:'+c.c1+';--c2:'+c.c2+'">'+c.emoji+'</div><h3>'+c.name+'</h3><p>'+c.rarity+' · В коллекции: '+data.owned[id]+'</p><div class="modal-actions"><button class="btn secondary" id="gift">Подарить</button><button class="btn" id="ok">Готово</button></div>',null);document.getElementById('ok').onclick=()=>overlay.classList.remove('show');document.getElementById('gift').onclick=()=>{chosenGift=id;giftShare();};}
function pack(){const today=new Date().toISOString().slice(0,10);if(data.lastPack===today){toast('Следующий бесплатный набор завтра');return;}const weights=cards.flatMap(c=>Array(c.rarity==='Легендарная'?1:c.rarity==='Эпическая'?2:c.rarity==='Редкая'?4:8).fill(c.id));const id=weights[Math.floor(Math.random()*weights.length)],c=get(id),dup=!!data.owned[id];data.owned[id]=(data.owned[id]||0)+1;data.lastPack=today;data.opened++;if(dup)data.fragments+=10;save();modalOpen('<button class="close" id="x">×</button><div class="eyebrow">НАБОР ОТКРЫТ</div><div class="bigart" style="--c1:'+c.c1+';--c2:'+c.c2+'">'+c.emoji+'</div><h3>'+c.name+'</h3><p>'+c.rarity+(dup?'<br>Повтор! Ты получил 10 осколков.':'<br>Новая карточка в твоём альбоме!')+'</p><button class="btn full" id="ok">Отлично</button>');document.getElementById('ok').onclick=()=>{overlay.classList.remove('show');render();};}
function renderHome(){const left=data.lastPack===new Date().toISOString().slice(0,10);main.innerHTML='<h1 class="heading">Твоя коллекция</h1><p class="sub">Открывай карточки, собирай редкие серии и делись находками с друзьями.</p><section class="hero"><div class="eyebrow">ТВОЯ ОХОТА ЗА РЕДКИМ</div><h2>'+(left?'Новая карточка уже ждёт завтра':'Открой свой первый набор')+'</h2><p>Внутри — случайная карточка. Иногда попадаются по-настоящему редкие экземпляры.</p><button class="btn" id="openPack">'+(left?'Набор открыт сегодня ✓':'Открыть бесплатный набор')+'</button></section><div class="stats"><div class="stat"><b>'+unique()+'<small style="color:var(--muted);font-size:11px"> / 18</small></b><span>Собрано карточек</span></div><div class="stat"><b>'+count()+'</b><span>Всего в альбоме</span></div><div class="stat"><b>'+data.fragments+'</b><span>Осколков</span></div></div><div class="section"><h3>Недавно добавлены</h3><button data-page="album">Весь альбом →</button></div><div class="grid">'+(cards.filter(c=>data.owned[c.id]).slice(-3).reverse().map(c=>cardHTML(c)).join('')||'<div class="empty" style="grid-column:1/-1">Здесь появятся твои первые находки. Открой бесплатный набор!</div>')+'</div><div class="section"><h3>Как это работает</h3></div><div class="widecard"><div class="wideicon">🎁</div><div class="widecopy"><b>Открывай наборы</b><small>Каждый день доступен один бесплатный набор.</small></div></div><div class="widecard"><div class="wideicon">🎴</div><div class="widecopy"><b>Собирай серии</b><small>В альбоме 18 карточек четырёх уровней редкости.</small></div></div><div class="widecard"><div class="wideicon">🎁</div><div class="widecopy"><b>Дари друзьям</b><small>Отправляй карточки по ссылке прямо в MAX.</small></div></div>';}
function renderAlbum(){main.innerHTML='<h1 class="heading">Альбом</h1><p class="sub">Собери все 18 карточек. Редкие экземпляры встречаются нечасто.</p><div class="widecard"><div class="widecopy"><b>Прогресс коллекции</b><small>'+unique()+' из '+cards.length+' карточек собрано</small><div class="progress"><i style="width:'+unique()/cards.length*100+'%"></i></div></div><span class="pill">'+Math.round(unique()/cards.length*100)+'%</span></div><div class="section"><h3>Все карточки</h3><span class="pill">'+unique()+'/18</span></div><div class="grid">'+cards.map(c=>cardHTML(c,!!data.owned[c.id])).join('')+'</div><p class="note">Данные коллекции пока сохраняются на этом устройстве. Не очищай данные браузера, чтобы не потерять альбом.</p>';}
function renderExchange(){const owned=cards.filter(c=>data.owned[c.id]);main.innerHTML='<h1 class="heading">Обмен</h1><p class="sub">Поделись карточкой с другом. Он получит её по ссылке и сможет добавить в свой альбом.</p><div class="hero"><div class="eyebrow">ДЕЛИСЬ НАХОДКАМИ</div><h2>Редкость становится интереснее вместе</h2><p>Выбери любую открытую карточку и отправь другу персональную ссылку-подарок.</p></div><div class="section"><h3>Выбери карточку</h3><span class="pill">'+owned.length+' доступно</span></div><div class="grid">'+(owned.map(c=>'<button class="card" data-gift="'+c.id+'"><div class="art" style="--c1:'+c.c1+';--c2:'+c.c2+'">'+c.emoji+'</div><b>'+c.name+'</b><small>Нажми, чтобы подарить</small></button>').join('')||'<div class="empty" style="grid-column:1/-1">Пока нечем делиться. Сначала открой набор на главной.</div>')+'</div><p class="note">Подарок — это копия карточки: твой экземпляр останется у тебя. Ссылка не одноразовая.</p>';}
function giftShare(){const c=get(chosenGift);if(!c)return;const payload=btoa(unescape(encodeURIComponent(JSON.stringify({id:c.id}))));const url=location.href.split('#')[0]+'#gift='+payload;const text='Дарю тебе карточку «'+c.name+'» из моей коллекции! Открой подарок: '+url;if(navigator.share){navigator.share({title:'Подарок из коллекции',text,url}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Ссылка-подарок скопирована'));}else{modalOpen('<h3>Ссылка-подарок</h3><p style="word-break:break-all">'+url+'</p><button class="btn full" id="ok">Закрыть</button>');document.getElementById('ok').onclick=()=>overlay.classList.remove('show');}}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')renderHome();if(page==='album')renderAlbum();if(page==='exchange')renderExchange();}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render();}});
main.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return;}const packBtn=e.target.closest('#openPack');if(packBtn){if(data.lastPack!==new Date().toISOString().slice(0,10))pack();else toast('Загляни завтра за новым набором');return;}const gift=e.target.closest('[data-gift]');if(gift){chosenGift=gift.dataset.gift;giftShare();return;}const c=e.target.closest('[data-card]');if(c)openCard(c.dataset.card);});
document.getElementById('profileBtn').onclick=()=>modalOpen('<button class="close" id="x">×</button><div class="eyebrow">ТВОЙ ПРОФИЛЬ</div><div class="bigart" style="--c1:#51447f;--c2:#25223f">☺</div><h3>Коллекционер</h3><p>Открыто наборов: '+data.opened+'<br>Карточек в альбоме: '+count()+'<br>Осколков: '+data.fragments+'</p><button class="btn full" id="ok">Закрыть</button>')|| (document.getElementById('ok').onclick=()=>overlay.classList.remove('show'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('show')});
load();render();giftImport();
})();
</script></body></html>
