<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAX Выгода</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0a0f; color:#fff; overflow-x:hidden; min-height:100vh; }
        .app-container { max-width:480px; margin:0 auto; padding:20px; min-height:100vh; display:flex; flex-direction:column; }
        .header { margin-bottom:20px; }
        .title { font-size:28px; font-weight:800; background:linear-gradient(135deg,#fff,#c0c0d0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .subtitle { color:#6b6b75; font-size:14px; }
        .search-box { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:10px 15px; display:flex; align-items:center; margin-bottom:15px; }
        .search-box input { background:none; border:none; color:#fff; font-size:16px; flex:1; outline:none; }
        .filters { display:flex; gap:8px; overflow-x:auto; margin-bottom:15px; }
        .chip { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:28px; padding:8px 14px; font-size:12px; cursor:pointer; white-space:nowrap; color:#9898a0; }
        .chip.active { background:rgba(79,143,255,0.15); border-color:rgba(79,143,255,0.3); color:#fff; }
        .sort { display:flex; gap:6px; margin-bottom:15px; align-items:center; }
        .sort span { color:#6b6b75; font-size:12px; }
        .sort-btn { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:6px 14px; font-size:12px; cursor:pointer; color:#9898a0; }
        .sort-btn.active { background:rgba(124,92,252,0.15); border-color:rgba(124,92,252,0.3); color:#7c5cfc; }
        .cards { display:flex; flex-direction:column; gap:12px; }
        .card { background:rgba(255,255,255,0.03); backdrop-filter:blur(15px); border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:16px; position:relative; animation:fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
        .vip { border:2px solid transparent; position:relative; }
        .vip::before { content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px; background:linear-gradient(135deg,#ffd700,#ffaa00); border-radius:24px; z-index:-1; animation:vipGlow 3s infinite; background-size:300% 300%; }
        @keyframes vipGlow { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
        .card-store { font-weight:700; font-size:16px; }
        .card-discount { font-size:22px; font-weight:800; background:linear-gradient(135deg,#2ecc71,#7bed9f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .card-desc { color:#9898a0; font-size:14px; }
        .card-date { color:#6b6b75; font-size:12px; margin:4px 0; }
        .card-stats { color:#6b6b75; font-size:11px; margin:4px 0; }
        .get-btn { background:linear-gradient(135deg,rgba(79,143,255,0.2),rgba(124,92,252,0.2)); border:1px solid rgba(79,143,255,0.3); color:#fff; padding:12px; border-radius:12px; font-weight:600; width:100%; cursor:pointer; margin-top:8px; font-family:inherit; }
        .fav-btn { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1); border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
        .badge { position:absolute; top:12px; left:12px; background:#ff6b6b; color:#fff; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; }
        .vip-badge { position:absolute; top:50px; left:12px; background:gold; color:#000; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; }
        .error { color:#ff6b6b; text-align:center; padding:30px; }
        .error button { margin-top:15px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:10px 20px; border-radius:12px; cursor:pointer; }
        .loading { text-align:center; padding:30px; color:#6b6b75; }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <script>
        // ⚙️ Ваши данные
        var CONFIG = {
            GOOGLE_SHEET_ID: '1Wtv4kA1W_hb4bvjyc7ruecrVw5s4Gh-TBQR1PRJYo2c',
            API_KEY: 'AIzaSyAbTbin2-mkFRspURGKRXxyCpjy_Dez8ts',
            SHEET_NAME: 'Акции',
            COLUMNS: { ID:0, STORE:1, CATEGORY:2, DISCOUNT:3, DESCRIPTION:4, LINK:5, LOGO:6, VIP:7, ACTIVE:8, DATE:9 }
        };

        // Простая обёртка для запросов
        function loadData() {
            var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.GOOGLE_SHEET_ID +
                      '/values/' + CONFIG.SHEET_NAME + '?key=' + CONFIG.API_KEY;
            fetch(url)
                .then(function(r) {
                    if (!r.ok) throw new Error('Ошибка HTTP: ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    if (!data.values || data.values.length < 2) {
                        throw new Error('Нет данных. Добавьте акции в таблицу.');
                    }
                    var rows = data.values.slice(1); // пропускаем заголовок
                    var offers = [];
                    for (var i = 0; i < rows.length; i++) {
                        var r = rows[i];
                        var active = r[CONFIG.COLUMNS.ACTIVE] ? r[CONFIG.COLUMNS.ACTIVE].toLowerCase().trim() : '';
                        if (active !== 'да') continue; // только активные
                        if (!r[CONFIG.COLUMNS.STORE]) continue; // нужен магазин
                        offers.push({
                            id: r[CONFIG.COLUMNS.ID] || (i+1),
                            store: r[CONFIG.COLUMNS.STORE],
                            category: r[CONFIG.COLUMNS.CATEGORY] || '',
                            discount: r[CONFIG.COLUMNS.DISCOUNT] || '',
                            description: r[CONFIG.COLUMNS.DESCRIPTION] || '',
                            link: r[CONFIG.COLUMNS.LINK] || '#',
                            logo: r[CONFIG.COLUMNS.LOGO] || '',
                            isVip: r[CONFIG.COLUMNS.VIP] && r[CONFIG.COLUMNS.VIP].toLowerCase().trim() === 'да',
                            date: r[CONFIG.COLUMNS.DATE] || ''
                        });
                    }
                    if (offers.length === 0) {
                        throw new Error('Нет активных акций (столбец I должен быть "Да").');
                    }
                    renderApp(offers);
                })
                .catch(function(err) {
                    document.getElementById('app').innerHTML = '<div class="error"><p>⚠️ Не удалось загрузить акции</p><p style="color:#6b6b75;font-size:14px;">' + err.message + '</p><button onclick="location.reload()">Повторить</button></div>';
                });
        }

        function renderApp(offers) {
            var html = '<div class="header"><div class="title">🎯 MAX Выгода</div><div class="subtitle">Лучшие предложения</div></div>';
            html += '<div class="search-box"><span style="margin-right:8px;">🔍</span><input type="text" placeholder="Поиск акций..." id="searchInput"></div>';
            html += '<div class="filters" id="filters"></div>';
            html += '<div class="sort"><span>Сортировка:</span><button class="sort-btn active" data-sort="new">Новые</button><button class="sort-btn" data-sort="discount">Макс. скидка</button></div>';
            html += '<div class="cards" id="cards"></div>';
            document.getElementById('app').innerHTML = html;

            // категории
            var cats = ['Все'];
            offers.forEach(function(o) { if (cats.indexOf(o.category) === -1) cats.push(o.category); });
            var filtersDiv = document.getElementById('filters');
            cats.forEach(function(cat) {
                var chip = document.createElement('div');
                chip.className = 'chip' + (cat === 'Все' ? ' active' : '');
                chip.textContent = cat;
                chip.onclick = function() {
                    document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
                    this.classList.add('active');
                    filterAndSort();
                };
                filtersDiv.appendChild(chip);
            });

            // сортировка
            var currentSort = 'new';
            document.querySelectorAll('.sort-btn').forEach(function(btn) {
                btn.onclick = function() {
                    document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    currentSort = this.dataset.sort;
                    filterAndSort();
                };
            });

            // поиск
            var searchInput = document.getElementById('searchInput');
            searchInput.oninput = filterAndSort;

            function filterAndSort() {
                var activeCat = document.querySelector('.chip.active').textContent;
                var query = searchInput.value.toLowerCase();
                var filtered = offers.filter(function(o) {
                    if (activeCat !== 'Все' && o.category !== activeCat) return false;
                    if (query && o.store.toLowerCase().indexOf(query) === -1 && o.description.toLowerCase().indexOf(query) === -1) return false;
                    return true;
                });
                if (currentSort === 'discount') {
                    filtered.sort(function(a,b) { return (parseInt(b.discount)||0) - (parseInt(a.discount)||0); });
                } else {
                    filtered.sort(function(a,b) { return b.id - a.id; });
                }
                renderCards(filtered);
            }

            function renderCards(list) {
                var cardsDiv = document.getElementById('cards');
                cardsDiv.innerHTML = '';
                if (list.length === 0) {
                    cardsDiv.innerHTML = '<div class="loading">Ничего не найдено</div>';
                    return;
                }
                list.forEach(function(o) {
                    var card = document.createElement('div');
                    card.className = 'card' + (o.isVip ? ' vip' : '');
                    var vipBadgeHtml = o.isVip ? '<div class="vip-badge">⭐ VIP</div>' : '';
                    var newBadge = (o.id > Math.max(...offers.map(x=>x.id)) - 3) ? '<div class="badge">NEW</div>' : ''; // условно новые
                    card.innerHTML = 
                        '<div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;margin-bottom:10px;">' +
                        (o.logo ? '<img src="' + o.logo + '" style="width:100%;height:100%;object-fit:contain;" alt="">' : o.store.charAt(0)) +
                        '</div>' +
                        '<button class="fav-btn">🤍</button>' +
                        newBadge +
                        vipBadgeHtml +
                        '<div class="card-store">' + o.store + '</div>' +
                        '<div class="card-discount">' + o.discount + '</div>' +
                        '<div class="card-desc">' + o.description + '</div>' +
                        '<div class="card-date">⏳ до ' + o.date + '</div>' +
                        '<div class="card-stats">👁 0  🔗 0</div>' +
                        '<button class="get-btn">Получить скидку</button>';
                    
                    card.querySelector('.get-btn').onclick = function(e) {
                        e.stopPropagation();
                        window.open(o.link, '_blank');
                    };
                    card.querySelector('.fav-btn').onclick = function(e) {
                        e.stopPropagation();
                        var btn = this;
                        btn.innerHTML = btn.innerHTML === '🤍' ? '❤️' : '🤍';
                    };
                    cardsDiv.appendChild(card);
                });
            }

            filterAndSort(); // начальная отрисовка
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('app').innerHTML = '<div class="loading">Загрузка...</div>';
            loadData();
        });
    </script>
</body>
</html>
