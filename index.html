<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Digital Gift Studio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="glass-header">
      <button id="backBtn" class="icon-btn hidden">←</button>
      <h1 class="header-title">Digital Gift Studio</h1>
      <button id="ordersBtn" class="icon-btn">📋</button>
    </header>

    <!-- Main Content -->
    <main id="mainContent" class="main-container">
      <!-- Screen: Home -->
      <section id="homeScreen" class="screen active">
        <div class="hero-card glass-card">
          <div class="hero-icon">✨</div>
          <h2>Создай волшебный подарок</h2>
          <p>Уникальные цифровые сюрпризы для близких</p>
          <button id="goToCatalogBtn" class="btn-primary">Смотреть каталог</button>
        </div>
        <div class="features-grid">
          <div class="feature-card glass-card">🎵<br>Песни</div>
          <div class="feature-card glass-card">💌<br>Открытки</div>
          <div class="feature-card glass-card">📖<br>Истории</div>
          <div class="feature-card glass-card">📸<br>AI-фото</div>
        </div>
      </section>

      <!-- Screen: Catalog -->
      <section id="catalogScreen" class="screen">
        <div class="catalog-grid" id="catalogContainer"></div>
      </section>

      <!-- Screen: Order Form -->
      <section id="orderFormScreen" class="screen">
        <form id="orderForm" class="glass-card form-card">
          <h3>Оформление заказа</h3>
          <div class="form-group">
            <label>Подарок</label>
            <input type="text" id="giftTitle" readonly>
          </div>
          <div class="form-group">
            <label>Имя получателя</label>
            <input type="text" id="recipientName" placeholder="Анна" required>
          </div>
          <div class="form-group">
            <label>Ваше послание</label>
            <textarea id="message" rows="3" placeholder="С любовью..."></textarea>
          </div>
          <div class="form-group">
            <label>Email для доставки</label>
            <input type="email" id="email" placeholder="email@example.com" required>
          </div>
          <input type="hidden" id="selectedGiftId">
          <button type="submit" class="btn-primary full-width">Перейти к оплате</button>
        </form>
      </section>

      <!-- Screen: Payment -->
      <section id="paymentScreen" class="screen">
        <div class="glass-card payment-card">
          <h3>Оплата</h3>
          <div id="orderSummary" class="order-summary"></div>
          <div class="payment-methods">
            <button class="payment-option glass-card">💳 Карта</button>
            <button class="payment-option glass-card">📱 СБП</button>
          </div>
          <button id="payBtn" class="btn-primary full-width">Оплатить</button>
          <p class="secure-note">🔒 Безопасное соединение</p>
        </div>
      </section>

      <!-- Screen: My Orders -->
      <section id="ordersScreen" class="screen">
        <div id="ordersList" class="orders-container"></div>
        <div id="emptyOrders" class="empty-state glass-card">📭<br>У вас пока нет заказов</div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav glass-footer">
      <button class="nav-item active" data-screen="home">🏠 Главная</button>
      <button class="nav-item" data-screen="catalog">🎁 Каталог</button>
      <button class="nav-item" data-screen="orders">📦 Заказы</button>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
